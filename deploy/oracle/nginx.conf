# nginx reverse-proxy config for Lilush bot on Oracle Cloud Free Tier.
#
# Drops into /etc/nginx/sites-available/lilush-bot then symlinked into
# /etc/nginx/sites-enabled/. Replace `bot.example.com` with your real
# domain (Oracle Free Tier gives you a public IPv4; point an A-record
# at it and you're done).
#
# This config:
#   • terminates TLS on 443 (managed by certbot, see README.md)
#   • redirects 80 → 443
#   • forwards everything to the bot's aiohttp on 127.0.0.1:$PORT
#   • sets long timeouts for the /test/, /fable5/, /masterroom/ slots
#     so streamed previews / long-running exec calls don't get killed
#
# After editing run:  sudo nginx -t && sudo systemctl reload nginx

# Upstream — the bot listens on PORT from /etc/lilush-bot.env (default 8080).
upstream lilush_bot {
    server 127.0.0.1:8080 fail_timeout=0;
    keepalive 8;
}

# HTTP → HTTPS redirect (certbot rewrites this section on first run).
server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;

    # ACME challenge support for Let's Encrypt renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.example.com;

    # Certbot fills these in on `sudo certbot --nginx -d bot.example.com`.
    # ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Reasonable defaults; tighten if you don't need legacy clients.
    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Health probe — quick.
    location = /healthz {
        proxy_pass http://lilush_bot;
        proxy_read_timeout 10s;
    }

    # «🧪 Тест» preview slot — small payloads, but allow long
    # rendering for big HTML responses.
    location /test/ {
        proxy_pass http://lilush_bot;
        proxy_read_timeout 60s;
    }

    # Fable5 live-access — POST /exec can block for the configured
    # subprocess timeout (default 20s, hard cap 120s). Keep nginx in
    # sync with that ceiling.
    location /fable5/ {
        proxy_pass http://lilush_bot;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # Master Room — reserved namespace, no routes today but match
    # ahead of time so a future rollout is just a code push.
    location /masterroom/ {
        proxy_pass http://lilush_bot;
        proxy_read_timeout 130s;
    }

    # Telegram webhook (only when BOT_MODE=webhook). The path is
    # /tg/<numeric-prefix-of-BOT_TOKEN>; the wildcard works for any
    # token without re-editing this file.
    location /tg/ {
        proxy_pass http://lilush_bot;
        proxy_read_timeout 30s;
    }

    # Everything else (root health page).
    location / {
        proxy_pass http://lilush_bot;
        proxy_read_timeout 30s;
    }
}
