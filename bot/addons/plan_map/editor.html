    applyTheme(savedTheme);
  });

  // --- вкл/выкл центр��льной ручки квадрата (растя��уть через центр) ---------
  var btnCenterResize = document.getElementById("btn-center-resize");
  function applyCenterResize(on) {
    document.documentElement.classList.toggle("center-resize-off", !on);
    btnCenterResize.classList.toggle("active", on);
    btnCenterResize.setAttribute("aria-pressed", on ? "true" : "false");
    btnCenterResize.title = on
      ? "Ручка в центре квадрата включена — нажми, чтобы выключить"
      : "Ручка в центре квадрата выключена — нажми, чтобы включить";
  }
  var centerResizeOn = true;
  try { centerResizeOn = localStorage.getItem("planmap-center-resize") !== "off"; } catch (e) { /* приватный режим */ }
  applyCenterResize(centerResizeOn);
  btnCenterResize.addEventListener("click", function () {
    centerResizeOn = !centerResizeOn;
    try { localStorage.setItem("planmap-center-resize", centerResizeOn ? "on" : "off"); } catch (e) { /* приватный режим */ }
    applyCenterResize(centerResizeOn);
  });

  // --- фломастер: свободное рисование поверх всей области -------------------
  var drawLayer = document.getElementById("draw-layer");
  var btnMarker = document.getElementById("btn-marker");
  var markerColorInput = document.getElementById("marker-color");
  var markerSizeInput = document.getElementById("marker-size");
  var markerEraseBtn = document.getElementById("marker-erase");
  var SVG_NS = "http://www.w3.org/2000/svg";

  var markerColor = "#ff3b30";
  var markerSize = 4;
  // Размер ластика хранится отдельно от толщины фломастера:
  // пока ластик включён, поле размера меняет именно его.
  var eraserSize = 16;
  try {
    markerColor = localStorage.getItem("planmap-marker-color") || "#ff3b30";
    markerSize = parseInt(localStorage.getItem("planmap-marker-size") || "4", 10) || 4;
    eraserSize = parseInt(localStorage.getItem("planmap-eraser-size") || "16", 10) || 16;
  } catch (e) { /* приватный режим */ }
  if (!/^#[0-9a-fA-F]{6}$/.test(markerColor)) markerColor = "#ff3b30";
  markerSize = Math.min(24, Math.max(2, markerSize));
  eraserSize = Math.min(24, Math.max(2, eraserSize));
  markerColorInput.value = markerColor;
  markerSizeInput.value = String(markerSize);

  var drawMode = false;
  var eraseMode = false;
  var eraseCursor = document.getElementById("erase-cursor");

  function setDrawMode(on) {
    drawMode = on;
    document.body.classList.toggle("draw-mode", on);
    btnMarker.classList.toggle("active", on);
    if (!on) setEraseMode(false);
  }
  function setEraseMode(on) {
    eraseMode = on;
    document.body.classList.toggle("draw-erase", on);
    markerEraseBtn.classList.toggle("active", on);
    // Поле размера переключается между толщиной фломастера и размером ластика
    markerSizeInput.value = String(on ? eraserSize : markerSize);
    markerSizeInput.title = on ? "Размер ластика" : "Толщина фломастера";
    if (on) {
      updateEraseCursorSize();
      eraseCursor.classList.add("on");
    } else {
      eraseCursor.classList.remove("on");
    }
  }

  // Белый квадратик-курсор ластика: следует за мышью, размер = размер
  // ластика с учётом текущего масштаба карты.
  function updateEraseCursorSize() {
    var z = (typeof zoom === "number" && zoom > 0) ? zoom : 1;
    var px = Math.max(8, eraserSize * z * 1.6);
    eraseCursor.style.width = px + "px";
    eraseCursor.style.height = px + "px";
  }
  document.addEventListener("pointermove", function (ev) {
    if (!eraseMode) return;
    eraseCursor.style.left = ev.clientX + "px";
    eraseCursor.style.top = ev.clientY + "px";
  }, true);

  btnMarker.addEventListener("click", function () {
    setDrawMode(!drawMode);
    showHint(drawMode
      ? "Фломастер включён: рисуй мышкой по всей област��. Ещё клик — выключить"
      : "Фломастер выключен");
  });
  markerEraseBtn.addEventListener("click", function () {
    if (!drawMode) setDrawMode(true);
    setEraseMode(!eraseMode);
    showHint(eraseMode ? "Ластик: клик по линии — удалить её" : "Ластик выключен — снова рисуем");
  });
  markerColorInput.addEventListener("input", function () {
    var v = markerColorInput.value;
    if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
    markerColor = v;
    try { localStorage.setItem("planmap-marker-color", markerColor); } catch (e) { /* приватный режим */ }
  });
  markerSizeInput.addEventListener("input", function () {
    var v = parseInt(markerSizeInput.value, 10);
    if (!v || v < 2 || v > 24) return;
    if (eraseMode) {
      // Пока включён ластик — меняем размер ластика, а не фломастера
      eraserSize = v;
      updateEraseCursorSize();
      try { localStorage.setItem("planmap-eraser-size", String(eraserSize)); } catch (e) { /* приватный режим */ }
    } else {
      markerSize = v;
      try { localStorage.setItem("planmap-marker-size", String(markerSize)); } catch (e) { /* приватный режим */ }
    }
  });

  // Нарисованные линии живут в plan.draw = [{c: цвет, w: толщина, d: путь}] —
  // сохраняются вместе с планом и участвуют в undo (snapshotData).
  function renderDraw() {
    while (drawLayer.firstChild) drawLayer.removeChild(drawLayer.firstChild);
    (plan.draw || []).forEach(function (s, i) {
      if (!s || !s.d) return;
      var p = document.createElementNS(SVG_NS, "path");
      p.setAttribute("d", s.d);
      p.setAttribute("stroke", s.c || "#ff3b30");
      p.setAttribute("stroke-width", String(s.w || 4));
      p.dataset.idx = String(i);
      if (selectedStrokeIdx && selectedStrokeIdx.indexOf(i) !== -1) p.classList.add("selected");
      drawLayer.appendChild(p);
    });
  }

  function drawPoint(ev) {
    var rect = world.getBoundingClientRect();
    var z = (typeof zoom === "number" && zoom > 0) ? zoom : 1;
    return {
      x: Math.round(((ev.clientX - rect.left) / z) * 10) / 10,
      y: Math.round(((ev.clientY - rect.top) / z) * 10) / 10
    };
  }

  // Ластик стирает всё, что попало в белый квадратик: ищем линии,
  // чьи точки ближе к курсору, чем размер ластика (в координатах карты).
  function pathNearPoint(d, px, py, radius) {
    var nums = d.match(/-?\d+(\.\d+)?/g);
    if (!nums) return false;
    var r2 = radius * radius;
    for (var i = 0; i + 1 < nums.length; i += 2) {
      var dx = parseFloat(nums[i]) - px;
      var dy = parseFloat(nums[i + 1]) - py;
      if (dx * dx + dy * dy <= r2) return true;
    }
    return false;
  }
  function eraseAt(ev) {
    var pt = drawPoint(ev);
    var radius = eraserSize * 0.8 + 4;
    var removed = false;
    for (var i = (plan.draw || []).length - 1; i >= 0; i--) {
      var s = plan.draw[i];
      if (s && s.d && pathNearPoint(s.d, pt.x, pt.y, radius)) {
        if (!removed) pushHistory();
        plan.draw.splice(i, 1);
        removed = true;
      }
    }
    if (removed) {
      renderDraw();
      markDirty();
    }
  }

  var stroke = null; // { d, el } — текущая линия под курсором
  var erasing = false; // зажат ластик — стираем при движении
  drawLayer.addEventListener("pointerdown", function (ev) {
    if (!drawMode || ev.button !== 0) return;
    if (eraseMode) {
      ev.preventDefault();
      erasing = true;
      eraseAt(ev);
      try { drawLayer.setPointerCapture(ev.pointerId); } catch (e) { /* синтетические события */ }
      return;
    }
    ev.preventDefault();
    var pt = drawPoint(ev);
    stroke = { d: "M" + pt.x + " " + pt.y, el: document.createElementNS(SVG_NS, "path") };
    stroke.el.setAttribute("stroke", markerColor);
    stroke.el.setAttribute("stroke-width", String(markerSize));
    stroke.el.setAttribute("d", stroke.d);
    drawLayer.appendChild(stroke.el);
    try { drawLayer.setPointerCapture(ev.pointerId); } catch (e) { /* синтетические события */ }
  });
  drawLayer.addEventListener("pointermove", function (ev) {
    if (erasing) { eraseAt(ev); return; }
    if (!stroke) return;
    var pt = drawPoint(ev);
    stroke.d += " L" + pt.x + " " + pt.y;
    stroke.el.setAttribute("d", stroke.d);
  });
  function endStroke() {
    erasing = false;
    if (!stroke) return;
    // Точка без движения — тоже след: чуть сдвигаем, чтобы линия была видна.
    if (stroke.d.indexOf("L") === -1) stroke.d += " l0.1 0";
    pushHistory();
    if (!Array.isArray(plan.draw)) plan.draw = [];
    plan.draw.push({ c: markerColor, w: markerSize, d: stroke.d });
    stroke = null;
    renderDraw();
    markDirty();
  }
  drawLayer.addEventListener("pointerup", endStroke);
  drawLayer.addEventListener("pointercancel", function () {
    erasing = false;
    if (stroke && stroke.el && stroke.el.parentNode) stroke.el.parentNode.removeChild(stroke.el);
    stroke = null;
  });

  window.addEventListener("beforeunload", function () {
    if (!dirty) return;
    // fetch() may be cancelled during unload — sendBeacon survives it.
    try {
      var blob = new Blob([JSON.stringify(savePayload())], { type: "application/json" });
      if (navigator.sendBeacon && navigator.sendBeacon(base + "/data", blob)) {
        dirty = false;
        return;
      }
    } catch (e) { /* fall through to best-effort fetch */ }
    try { save(); } catch (e) { /* best effort */ }
  });

  renderTabs();
  load();
})();
</script>
</body>
</html>
