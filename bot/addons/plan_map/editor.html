<script>
(function () {
  "use strict";

  // Token is the path segment right after /planmap/.
  var m = location.pathname.match(/\/planmap\/([^/]+)/);
  var base = m ? "/planmap/" + m[1] : "";

  var PLAN_COUNT = 5;

  function emptyPlan(i) {
    return { name: "план " + (i + 1), nodes: [], edges: [], draw: [] };
  }
  function emptyStore() {
    var plans = [];
    for (var i = 0; i < PLAN_COUNT; i++) plans.push(emptyPlan(i));
    return { version: 2, active: 0, plans: plans };
  }

  var store = emptyStore();
  var plan = store.plans[0]; // активный план (nodes + edges)

  var world = document.getElementById("world");
  var svg = document.getElementById("edges");
  var edgeDefs = document.getElementById("edge-defs");
  var statusEl = document.getElementById("status");
  var hintEl = document.getElementById("hint");
  var btnLink = document.getElementById("btn-link");
  var marqueeEl = document.getElementById("marquee");

  var linkMode = false;
  var linkSrc = null;      // node id chosen as arrow source (режим «стрелка»)
  var pendingDot = null;   // {nodeId, side} — тянем стрелку из пупырошка
  var dirty = false;
  var saveTimer = null;

  // --- виды стрелок: кнопки показывают только жирность, цвет выбирается
  // отдельно (квадратик рядом). Самая жирная (5) — градиент: по краям
  // слабее, в центре выбранный цвет.
  var ARROW_STYLES = {
    1: { width: 2 },
    2: { width: 3 },
    3: { width: 4 },
    4: { width: 5.5 },
    5: { width: 7.5, gradient: true }
  };
  // Цвета старых стрелок (карты, сохранённые до появления выбора цвета).
  var LEGACY_ARROW_COLORS = { 1: "#1d1d1f", 2: "#1d1d1f", 3: "#0071e3", 4: "#ff9500", 5: "#ff3b30" };
  var arrowStyle = 1;
  try { arrowStyle = parseInt(localStorage.getItem("planmap-arrow-style") || "1", 10) || 1; } catch (e) {}
  if (!ARROW_STYLES[arrowStyle]) arrowStyle = 1;
  var arrowColor = "#1d1d1f";
  try { arrowColor = localStorage.getItem("planmap-arrow-color") || "#1d1d1f"; } catch (e) {}
  if (!/^#[0-9a-fA-F]{6}$/.test(arrowColor)) arrowColor = "#1d1d1f";

  // Более слабый (��азбавленный) вариант цвета — для краёв жирной стрелки.
  function weakenColor(hex, amt) {
    var r = parseInt(hex.slice(1, 3), 16),
        g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
    r = Math.round(r + (255 - r) * amt);
    g = Math.round(g + (255 - g) * amt);
    b = Math.round(b + (255 - b) * amt);
    function h2(v) { return ("0" + v.toString(16)).slice(-2); }
    return "#" + h2(r) + h2(g) + h2(b);
  }
  function edgeColor(e) {
    if (e.color && /^#[0-9a-fA-F]{6}$/.test(e.color)) return e.color;
    return LEGACY_ARROW_COLORS[e.style] || "#1d1d1f";
  }

  var linkTool = "arrow"; // "arrow" | "dots"
  try { linkTool = localStorage.getItem("planmap-link-tool") || "arrow"; } catch (e) {}
  if (linkTool !== "dots") linkTool = "arrow";

  // --- режимы отображения ("полная" | "средняя" | "little") ---------------
  var viewMode = "full";
  var mediumChars = 100;
  try {
    viewMode = localStorage.getItem("planmap-view") || "full";
    mediumChars = parseInt(localStorage.getItem("planmap-medium-chars") || "100", 10) || 100;
  } catch (e) { /* приватный режим */ }
  var PROMPT_COUNT_MIN = 100; // счётчик знаков у «копировать» появляется после 100

  function setStatus(t) { statusEl.textContent = t; }
  function showHint(t) {
    hintEl.textContent = t;
    hintEl.classList.add("show");
    clearTimeout(showHint._t);
    showHint._t = setTimeout(function () { hintEl.classList.remove("show"); }, 2500);
  }
  function uid() { return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function findNode(id) {
    for (var i = 0; i < plan.nodes.length; i++) if (plan.nodes[i].id === id) return plan.nodes[i];
    return null;
  }

  // --- история действий («вернуть», до 5 шагов) ----------------------------
  var history = [];
  var btnUndo = document.getElementById("btn-undo");
  function snapshotData() {
    return JSON.parse(JSON.stringify({ nodes: plan.nodes, edges: plan.edges, draw: plan.draw || [] }));
  }
  function pushHistory(snap) {
    history.push(snap || snapshotData());
    if (history.length > 5) history.shift();
    btnUndo.disabled = false;
  }
  function undo() {
    if (!history.length) { showHint("Нечего возвращать"); return; }
    var snap = history.pop();
    plan.nodes = snap.nodes;
    plan.edges = snap.edges;
    plan.draw = snap.draw || [];
    renderAll();
    renderTabs();
    markDirty();
    btnUndo.disabled = history.length === 0;
    showHint("Действие отменено (осталось " + history.length + ")");
  }
  btnUndo.addEventListener("click", undo);
  btnUndo.disabled = true;

  // --- persistence -------------------------------------------------------
  function markDirty() {
    dirty = true;
    setStatus("несохранённые изменения…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 1200); // autosave
  }

  function savePayload() {
    // Полное хранилище + зеркалим активный план сверху (совместимость).
    return {
      version: 2,
      active: store.active,
      plans: store.plans,
      title: store.plans[store.active].name || "План карта",
      nodes: plan.nodes,
      edges: plan.edges,
      draw: plan.draw || []
    };
  }

  function save() {
    if (!dirty) return;
    setStatus("сохраняю…");
    fetch(base + "/data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(savePayload())
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      dirty = false;
      setStatus("сохранено ✓");
    }).catch(function (e) {
      setStatus("ошибка сохранения: " + e.message);
    });
  }

  function adoptData(data) {
    if (data && Array.isArray(data.plans) && data.plans.length) {
      store = emptyStore();
      for (var i = 0; i < PLAN_COUNT; i++) {
        var p = data.plans[i];
        if (p && Array.isArray(p.nodes) && Array.isArray(p.edges)) {
          store.plans[i] = {
            name: p.name || "план " + (i + 1),
            nodes: p.nodes,
            edges: p.edges,
            draw: Array.isArray(p.draw) ? p.draw : []
          };
        }
      }
      var a = parseInt(data.active, 10);
      store.active = (a >= 0 && a < PLAN_COUNT) ? a : 0;
    } else {
      // старый формат {title, nodes, edges} → кладём в план 1
      store = emptyStore();
      store.plans[0] = {
        name: (data && data.title) || "план 1",
        nodes: (data && data.nodes) || [],
        edges: (data && data.edges) || [],
        draw: (data && Array.isArray(data.draw)) ? data.draw : []
      };
      store.active = 0;
    }
    plan = store.plans[store.active];
  }

  function load() {
    fetch(base + "/data").then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (data) {
      adoptData(data);
      renderAll();
      renderTabs();
      setStatus(plan.nodes.length ? "загружено ✓" : "пусто — добавь квадрат");
    }).catch(function (e) {
      setStatus("ошибка загрузки: " + e.message);
    });
  }

  // --- планы 1–5 (вкладки сверху) ------------------------------------------
  var tabsEl = document.getElementById("plan-tabs");
  function renderTabs() {
    tabsEl.innerHTML = "";
    store.plans.forEach(function (p, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "plan-tab " + (
        i === store.active ? "active" : (p.nodes.length ? "created" : "empty")
      );
      // Большая цифра сверху, слово «план» (или своё название) — внизу к��опки.
      var num = document.createElement("span");
      num.className = "pt-num";
      num.textContent = String(i + 1);
      var word = document.createElement("span");
      word.className = "pt-word";
      var defName = "план " + (i + 1);
      word.textContent = (p.name && p.name !== defName) ? p.name : "план";
      b.appendChild(num);
      b.appendChild(word);
      b.title = i === store.active
        ? "Текущий план. Двойной клик — переименовать"
        : (p.nodes.length ? "Открыть план" : "План не создан — нажми, чтобы начать. Двойной клик — переименовать");
      b.addEventListener("click", function () { switchPlan(i); });
      b.addEventListener("dblclick", function (ev) {
        ev.preventDefault();
        var name = prompt("Название плана:", p.name || ("план " + (i + 1)));
        if (name === null) return;
        name = String(name).trim().slice(0, 60);
        if (!name) name = "план " + (i + 1);
        p.name = name;
        renderTabs();
        markDirty();
      });
      tabsEl.appendChild(b);
    });
  }
  function switchPlan(i) {
    if (i === store.active) return;
    clearSelection();
    cancelPendingDot();
    if (linkSrc) { var s = nodeEl(linkSrc); if (s) s.classList.remove("link-src"); linkSrc = null; }
    store.active = i;
    plan = store.plans[i];
    history = [];
    btnUndo.disabled = true;
    renderAll();
    renderTabs();
    markDirty();
    showHint("Открыт «" + (plan.name || ("план " + (i + 1))) + "»");
  }

  // --- edges (SVG arrows) --------------------------------------------------
  function nodeEl(id) { return world.querySelector('.node[data-id="' + id + '"]'); }

  function edgeAnchor(el) {
    return {
      x: el.offsetLeft + el.offsetWidth / 2,
      y: el.offsetTop + el.offsetHeight / 2,
      w: el.offsetWidth,
      h: el.offsetHeight
    };
  }

  // Point on the border of the box towards the other box's center.
  function borderPoint(a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    if (dx === 0 && dy === 0) return { x: a.x, y: a.y };
    var sx = (a.w / 2) / Math.abs(dx || 1e-6);
    var sy = (a.h / 2) / Math.abs(dy || 1e-6);
    var s = Math.min(sx, sy);
    return { x: a.x + dx * s, y: a.y + dy * s };
  }

  // Маркеры-наконечники: создаются по цвету (стрелки ��еперь любого цвета).
  function ensureMarker(color) {
    var id = "arrow-c" + color.replace("#", "");
    if (!document.getElementById(id)) {
      var mk = document.createElementNS("http://www.w3.org/2000/svg", "marker");
      mk.setAttribute("id", id);
      mk.setAttribute("viewBox", "0 0 10 10");
      mk.setAttribute("refX", "9");
      mk.setAttribute("refY", "5");
      mk.setAttribute("markerWidth", "8");
      mk.setAttribute("markerHeight", "8");
      mk.setAttribute("orient", "auto-start-reverse");
      var pth = document.createElementNS("http://www.w3.org/2000/svg", "path");
      // Изящный «ласточкин» наконечник вместо простого треугольника.
      pth.setAttribute("d", "M 0.5 0.8 L 10 5 L 0.5 9.2 Q 3.6 5 0.5 0.8 z");
      pth.setAttribute("fill", color);
      mk.appendChild(pth);
      edgeDefs.appendChild(mk);
    }
    return id;
  }
  // Градиент вдоль стрелки: по краям слабее, в центре — выбранный цвет.
  function ensureEdgeGradient(idx, color, p1, p2) {
    var id = "edge-grad-" + idx;
    var old = document.getElementById(id);
    if (old) old.remove();
    var weak = weakenColor(color, 0.55);
    var g = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
    g.setAttribute("id", id);
    g.setAttribute("gradientUnits", "userSpaceOnUse");
    g.setAttribute("x1", p1.x); g.setAttribute("y1", p1.y);
    g.setAttribute("x2", p2.x); g.setAttribute("y2", p2.y);
    [[0, weak], [0.5, color], [1, weak]].forEach(function (s) {
      var stop = document.createElementNS("http://www.w3.org/2000/svg", "stop");
      stop.setAttribute("offset", (s[0] * 100) + "%");
      stop.setAttribute("stop-color", s[1]);
      g.appendChild(stop);
    });
    edgeDefs.appendChild(g);
    return id;
  }

  function renderEdges() {
    // Remove old paths (keep <defs>).
    Array.prototype.slice.call(svg.querySelectorAll("path.edge, path.edge-hit, path.edge-outline"))
      .forEach(function (p) { p.remove(); });
    Array.prototype.slice.call(edgeDefs.querySelectorAll("linearGradient"))
      .forEach(function (g) { g.remove(); });
    plan.edges.forEach(function (e, idx) {
      var elA = nodeEl(e.from), elB = nodeEl(e.to);
      if (!elA || !elB) return;
      var st = ARROW_STYLES[e.style] || ARROW_STYLES[1];
      var a = edgeAnchor(elA), b = edgeAnchor(elB);
      var p1 = borderPoint(a, b), p2 = borderPoint(b, a);
      // Красивая плавная дуга вместо прямой линии.
      var ddx = p2.x - p1.x, ddy = p2.y - p1.y;
      var dl = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
      var bow = Math.min(36, dl * 0.12);
      var mx = (p1.x + p2.x) / 2 - (ddy / dl) * bow;
      var my = (p1.y + p2.y) / 2 + (ddx / dl) * bow;
      var d = "M " + p1.x + " " + p1.y + " Q " + mx + " " + my + " " + p2.x + " " + p2.y;

      var hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
      hit.setAttribute("d", d);
      hit.setAttribute("class", "edge-hit");
      hit.addEventListener("click", function () { removeEdge(idx); });
      svg.appendChild(hit);

      var col = edgeColor(e);
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      path.setAttribute("class", "edge");
      if (st.gradient) {
        // Самая жирная: края слабее, центр — выбранный цвет.
        var gid = ensureEdgeGradient(idx, col, p1, p2);
        path.setAttribute("stroke", "url(#" + gid + ")");
        path.setAttribute("marker-end", "url(#" + ensureMarker(weakenColor(col, 0.55)) + ")");
      } else {
        path.setAttribute("stroke", col);
        path.setAttribute("marker-end", "url(#" + ensureMarker(col) + ")");
      }
      path.setAttribute("stroke-width", st.width);
      path.dataset.idx = String(idx);
      if (selectedEdgeIdx && selectedEdgeIdx.indexOf(idx) !== -1) path.classList.add("selected");
      path.addEventListener("click", function () { removeEdge(idx); });
      svg.appendChild(path);
    });
  }

  function removeEdge(idx) {
    if (!confirm("Удалить стрелку?")) return;
    pushHistory();
    plan.edges.splice(idx, 1);
    renderEdges();
    markDirty();
  }

  // --- панель «стрелочки»: режим + 5 видов ----------------------------------
  var modeDotsBtn = document.getElementById("mode-dots");
  function applyLinkTool() {
    document.body.setAttribute("data-linktool", linkTool);
    // «выбор» подсвечен, когда включён режим рисования стрелок кликами
    btnLink.classList.toggle("active", linkTool === "arrow" && linkMode);
    // Пока «выбор» активен — рабочая область подсвечена шагающей рамкой
    document.body.classList.toggle("link-mode", linkTool === "arrow" && linkMode);
    modeDotsBtn.classList.toggle("active", linkTool === "dots");
    try { localStorage.setItem("planmap-link-tool", linkTool); } catch (e) {}
    if (linkTool !== "dots") cancelPendingDot();
  }
  modeDotsBtn.addEventListener("click", function () {
    linkTool = "dots";
    linkMode = false;
    if (linkSrc) {
      var s = nodeEl(linkSrc);
      if (s) s.classList.remove("link-src");
      linkSrc = null;
    }
    applyLinkTool();
    showHint("Пупырошки: нажми точку у квадратика и потом другой квадратик (или его точку)");
  });
  applyLinkTool();

  var stylesRow = document.getElementById("arrow-styles");
  var arrowColorInput = document.getElementById("arrow-color");
  arrowColorInput.value = arrowColor;
  function renderStyleButtons() {
    stylesRow.innerHTML = "";
    Object.keys(ARROW_STYLES).forEach(function (k) {
      var st = ARROW_STYLES[k];
      var b = document.createElement("button");
      b.type = "button";
      b.title = "Жирность " + k + (st.gradient ? " (по краям слабее, в центре — выбранный цвет)" : "");
      b.className = String(k) === String(arrowStyle) ? "active" : "";
      var w = Math.min(st.width, 7);
      var weak = weakenColor(arrowColor, 0.55);
      var lineStroke = arrowColor;
      var headFill = arrowColor;
      var gradDef = "";
      if (st.gradient) {
        var gid = "btn-grad-" + k;
        gradDef =
          // userSpaceOnUse: у горизонтальной линии нулевая высота bbox,
          // из-за чего градиент в objectBoundingBox не рисовался вовсе —
          // самая жирная стрелка в меню выглядела «не дорисованной».
          '<defs><linearGradient id="' + gid + '" gradientUnits="userSpaceOnUse" x1="1.5" y1="8" x2="32" y2="8">' +
          '<stop offset="0%" stop-color="' + weak + '"/>' +
          '<stop offset="50%" stop-color="' + arrowColor + '"/>' +
          '<stop offset="100%" stop-color="' + weak + '"/>' +
          "</linearGradient></defs>";
        lineStroke = "url(#" + gid + ")";
        headFill = weak;
      }
      // viewBox с запасом: у самой жирной стрелки round-cap и кончик
      // наконечника раньше обрезались краями — теперь рисуется целиком.
      var svgline =
        '<svg width="36" height="16" viewBox="0 0 36 16">' + gradDef +
        '<line x1="5" y1="8" x2="27" y2="8" stroke="' + lineStroke + '" stroke-width="' + w + '" stroke-linecap="round"/>' +
        '<path d="M 24.5 3.4 L 32 8 L 24.5 12.6 Q 27 8 24.5 3.4 z" fill="' + headFill + '"/>' +
        "</svg>";
      b.innerHTML = svgline;
      b.addEventListener("click", function () {
        arrowStyle = parseInt(k, 10);
        try { localStorage.setItem("planmap-arrow-style", String(arrowStyle)); } catch (e) {}
        renderStyleButtons();
        showHint("Новые стрелки будут жирности " + k);
      });
      stylesRow.appendChild(b);
    });
  }
  renderStyleButtons();
  arrowColorInput.addEventListener("input", function () {
    var v = arrowColorInput.value;
    if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
    arrowColor = v;
    try { localStorage.setItem("planmap-arrow-color", arrowColor); } catch (e) {}
    renderStyleButtons();
  });
  arrowColorInput.addEventListener("change", function () {
    showHint("Новые стрелки будут цвета " + arrowColor);
  });

  // --- пупырошки: создание/удаление стрелок ----------------------------------
  // Стрелка-призрак: пока тянем из пупырошка, за курсором следует стрелочка.
  var ghostPath = null;
  function removeGhost() {
    if (ghostPath) { ghostPath.remove(); ghostPath = null; }
  }
  function dotPoint(el, side) {
    var x = el.offsetLeft, y = el.offsetTop, w = el.offsetWidth, h = el.offsetHeight;
    if (side === "t") return { x: x + w / 2, y: y };
    if (side === "b") return { x: x + w / 2, y: y + h };
    if (side === "l") return { x: x, y: y + h / 2 };
    return { x: x + w, y: y + h / 2 };
  }
  document.addEventListener("pointermove", function (ev) {
    if (!pendingDot) { removeGhost(); return; }
    var srcEl = nodeEl(pendingDot.nodeId);
    if (!srcEl) { removeGhost(); return; }
    var st = ARROW_STYLES[arrowStyle] || ARROW_STYLES[1];
    if (!ghostPath) {
      ghostPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
      ghostPath.setAttribute("class", "edge-ghost");
      svg.appendChild(ghostPath);
    }
    ghostPath.setAttribute("stroke", arrowColor);
    ghostPath.setAttribute("stroke-width", st.width);
    ghostPath.setAttribute("marker-end", "url(#" + ensureMarker(arrowColor) + ")");
    var p1 = dotPoint(srcEl, pendingDot.side);
    var rect = world.getBoundingClientRect();
    var z = (typeof zoom === "number" && zoom > 0) ? zoom : 1;
    var x2 = (ev.clientX - rect.left) / z;
    var y2 = (ev.clientY - rect.top) / z;
    var gdx = x2 - p1.x, gdy = y2 - p1.y;
    var gl = Math.sqrt(gdx * gdx + gdy * gdy) || 1;
    var gb = Math.min(36, gl * 0.12);
    var gmx = (p1.x + x2) / 2 - (gdy / gl) * gb;
    var gmy = (p1.y + y2) / 2 + (gdx / gl) * gb;
    ghostPath.setAttribute("d", "M " + p1.x + " " + p1.y + " Q " + gmx + " " + gmy + " " + x2 + " " + y2);
  });

  function cancelPendingDot() {
    if (!pendingDot) return;
    removeGhost();
    var el = nodeEl(pendingDot.nodeId);
    if (el) {
      el.classList.remove("link-src");
      var d = el.querySelector(".dot.armed");
      if (d) d.classList.remove("armed");
    }
    pendingDot = null;
  }

  function completeDotLink(targetId) {
    if (!pendingDot || pendingDot.nodeId === targetId) { cancelPendingDot(); return; }
    var dup = plan.edges.some(function (e) { return e.from === pendingDot.nodeId && e.to === targetId; });
    if (dup) {
      showHint("Такая стрелка уже есть");
    } else {
      pushHistory();
      plan.edges.push({
        from: pendingDot.nodeId,
        to: targetId,
        style: arrowStyle,
        color: arrowColor,
        from_side: pendingDot.side
      });
      renderEdges();
      markDirty();
      showHint("Стрелка добавлена");
    }
    cancelPendingDot();
  }

  function onDotClick(n, side, dotEl, ev) {
    ev.stopPropagation();
    // Уже тянем из этого же пупырошка — отмена.
    if (pendingDot && pendingDot.nodeId === n.id && pendingDot.side === side) {
      cancelPendingDot();
      showHint("Отменено");
      return;
    }
    // Тянем из другого квадратика — этот пупырошек становится целью.
    if (pendingDot && pendingDot.nodeId !== n.id) {
      completeDotLink(n.id);
      return;
    }
    // Если из этого пупырошка уже направлена стрелочка — убрать её.
    var existing = plan.edges.filter(function (e) {
      return e.from === n.id && (e.from_side || "") === side;
    });
    if (existing.length) {
      pushHistory();
      plan.edges = plan.edges.filter(function (e) {
        return !(e.from === n.id && (e.from_side || "") === side);
      });
      renderEdges();
      markDirty();
      showHint("Стрелочка убрана");
      return;
    }
    // Иначе — начинаем тянуть стрелочку из этого пупырошка.
    cancelPendingDot();
    pendingDot = { nodeId: n.id, side: side };
    var el = nodeEl(n.id);
    if (el) el.classList.add("link-src");
    dotEl.classList.add("armed");
    showHint("Теперь нажми другой квадратик или его пупырошек — туда пойдёт стрелка");
  }

  // --- helpers -------------------------------------------------------------
  function autoGrow(ta) {
    // Раскрыть textarea под весь текст (для «полной» и раскрытого квадрата).
    ta.style.height = "auto";
    ta.style.height = Math.max(ta.scrollHeight, 20) + "px";
  }
  function nodeMaxWidth(n) { return n.kind === "table" ? 1400 : 800; }
  function nodeWidth(n) {
    var w = parseFloat(n.w);
    if (!w || isNaN(w)) return n.kind === "table" ? 380 : 220;
    return Math.min(nodeMaxWidth(n), Math.max(160, w));
  }
  function nodeHeight(n) {
    // Ручная высота (тянется за кружок в центре); 0 = авто по содержимому.
    var h = parseFloat(n.h);
    if (!h || isNaN(h)) return 0;
    return Math.min(1600, Math.max(60, h));
  }

  // --- nodes ---------------------------------------------------------------
  function renderNode(n) {
    var el = document.createElement("div");
    el.className = "node" + (n.kind === "note" ? " note" : "") + (n.kind === "table" ? " table" : "") + (n.kind === "image" ? " image" : "");
    el.dataset.id = n.id;
    applyNodeFontVars(el, n); // личный шрифт квадратика (режим «только выбранным»)
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    el.style.width = nodeWidth(n) + "px";
    var nh0 = nodeHeight(n);
    if (nh0) el.style.minHeight = nh0 + "px";

    var grip = document.createElement("div");
    grip.className = "grip";
    grip.textContent = "⋮⋮⋮";
    grip.title = "Тяни, чтобы переместить";

    var head = document.createElement("div");
    head.className = "head";

    // «Примечание» — без названия зелёного окошка (только текст).
    var name = document.createElement("input");
    name.className = "name";
    name.placeholder = "Название…";
    name.value = n.name || "";
    name.addEventListener("input", function () { n.name = name.value; updatePreview(); markDirty(); });

    // «Действия» — оранжевая кнопка-ярлык справа сверху от текста.
    // Вставляет оранжевый блок в место курсора (в любом порядке, сколько угодно).
    var btnActions = document.createElement("button");
    btnActions.className = "chip chip-actions";
    btnActions.type = "button";
    btnActions.textContent = "действия";
    btnActions.title = "Вставить блок действий в месте курсора (можно несколько, в любом порядке)";

    // «Промт» — голубая кнопка рядом. Тоже вставляется в место курсора.
    var btnPrompt = document.createElement("button");
    btnPrompt.className = "chip chip-prompt";
    btnPrompt.type = "button";
    btnPrompt.textContent = "промт";
    btnPrompt.title = "Вставить блок промта в месте курсора (можно несколько, в любом порядке)";

    if (n.kind !== "note" && n.kind !== "table") {
      head.appendChild(name);
      head.appendChild(btnActions);
      head.appendChild(btnPrompt);
    }

    // --- Табл��ца: 2 цифры сверху (деления вни�� × в ширину) + сетка ячеек ---
    function buildTableBlock() {
      if (!n.rows || n.rows < 1) n.rows = 3;
      if (!n.cols || n.cols < 1) n.cols = 3;
      if (!n.cells || typeof n.cells !== "object") n.cells = {};
      var wrap = document.createElement("div");

      var ctr = document.createElement("div");
      ctr.className = "table-controls";
      var rowsIn = document.createElement("input");
      rowsIn.type = "number"; rowsIn.min = "1"; rowsIn.max = "30";
      rowsIn.value = String(n.rows);
      rowsIn.title = "Сколько делений вниз (строк)";
      var xMark = document.createElement("span");
      xMark.textContent = "×";
      var colsIn = document.createElement("input");
      colsIn.type = "number"; colsIn.min = "1"; colsIn.max = "12";
      colsIn.value = String(n.cols);
      colsIn.title = "Сколько делений в ширину (столбцов)";
      // «высота» и «ширина» — над областями цифр
      var rowsCol = document.createElement("div");
      rowsCol.className = "tc-col";
      var rowsLbl = document.createElement("div");
      rowsLbl.className = "tc-lbl";
      rowsLbl.textContent = "высота";
      rowsCol.appendChild(rowsLbl);
      rowsCol.appendChild(rowsIn);
      var colsCol = document.createElement("div");
      colsCol.className = "tc-col";
      var colsLbl = document.createElement("div");
      colsLbl.className = "tc-lbl";
      colsLbl.textContent = "ширина";
      colsCol.appendChild(colsLbl);
      colsCol.appendChild(colsIn);
      ctr.appendChild(rowsCol);
      ctr.appendChild(xMark);
      ctr.appendChild(colsCol);

      // Ручные размеры: ширина столбцов и высота строк (сохраняются в плане).
      if (!n.colw || typeof n.colw !== "object") n.colw = {};
      if (!n.rowh || typeof n.rowh !== "object") n.rowh = {};

      var tbl = document.createElement("table");
      tbl.className = "grid-table";

      var rowTas = {}; // r -> [textarea, ...]
      var colEls = {}; // c -> <col>

      function rowMin(r) {
        var h = parseFloat(n.rowh[r]);
        return (h && !isNaN(h)) ? Math.max(28, h) : 28;
      }
      function autoGrowCell(ta, r) {
        ta.style.height = "auto";
        ta.style.height = Math.max(ta.scrollHeight, rowMin(r)) + "px";
      }
      function applyRowHeights(r) {
        (rowTas[r] || []).forEach(function (ta) {
          ta.style.minHeight = rowMin(r) + "px";
          autoGrowCell(ta, r);
        });
      }
      function fixAllHeights() {
        Object.keys(rowTas).forEach(function (r) { applyRowHeights(r); });
      }
      el._fixTableHeights = fixAllHeights;

      // Общий помощник перетаскивания для ручек ячеек.
      function dragHandle(handle, getBase, onMove) {
        var st = null;
        handle.addEventListener("pointerdown", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          st = { px: ev.clientX, py: ev.clientY, pre: snapshotData(), moved: false, base: getBase() };
          handle.classList.add("dragging");
          try { handle.setPointerCapture(ev.pointerId); } catch (e) { /* синтетические события */ }
        });
        handle.addEventListener("pointermove", function (ev) {
          if (!st) return;
          var z = (typeof zoom === "number" && zoom > 0) ? zoom : 1;
          var dx = (ev.clientX - st.px) / z;
          var dy = (ev.clientY - st.py) / z;
          if (Math.abs(dx) + Math.abs(dy) > 2) st.moved = true;
          if (!st.moved) return;
          onMove(st.base, dx, dy);
          renderEdges();
        });
        function endDrag() {
          if (st && st.moved) { pushHistory(st.pre); markDirty(); }
          handle.classList.remove("dragging");
          st = null;
        }
        handle.addEventListener("pointerup", endDrag);
        handle.addEventListener("pointercancel", endDrag);
      }

      function buildGrid() {
        tbl.innerHTML = "";
        rowTas = {};
        colEls = {};
        // <colgroup> — чтобы ширины столбцов можно было менять вручную.
        var cg = document.createElement("colgroup");
        for (var c0 = 0; c0 < n.cols; c0++) {
          var col = document.createElement("col");
          if (n.colw[c0]) col.style.width = n.colw[c0] + "px";
          colEls[c0] = col;
          cg.appendChild(col);
        }
        tbl.appendChild(cg);
        for (var r = 0; r < n.rows; r++) {
          var tr = document.createElement("tr");
          rowTas[r] = [];
          for (var c = 0; c < n.cols; c++) {
            (function (key, r, c) {
              var td = document.createElement("td");
              var ta = document.createElement("textarea");
              ta.rows = 1;
              ta.value = n.cells[key] || "";
              ta.style.minHeight = rowMin(r) + "px";
              ta.addEventListener("input", function () {
                n.cells[key] = ta.value;
                autoGrowCell(ta, r); // ячейка растёт вниз под текст
                renderEdges();
                markDirty();
              });
              td.appendChild(ta);
              rowTas[r].push(ta);

              // Ручка на правой границе — ширина столбца (вручную).
              var hx = document.createElement("div");
              hx.className = "cell-rs-x";
              hx.title = "Тяни — ширина столбца";
              dragHandle(hx, function () {
                return td.offsetWidth;
              }, function (base, dx) {
                var w = Math.min(900, Math.max(40, base + dx));
                n.colw[c] = Math.round(w);
                if (colEls[c]) colEls[c].style.width = n.colw[c] + "px";
                fixAllHeights();
              });
              td.appendChild(hx);

              // Ручка на нижней границе — высота строки (вручную).
              var hy = document.createElement("div");
              hy.className = "cell-rs-y";
              hy.title = "Тяни — высота строки (ячейка расширяется вниз)";
              dragHandle(hy, function () {
                return rowMin(r) === 28 ? td.offsetHeight : rowMin(r);
              }, function (base, dx2, dy) {
                var h = Math.min(1200, Math.max(28, base + dy));
                n.rowh[r] = Math.round(h);
                applyRowHeights(r);
              });
              td.appendChild(hy);

              tr.appendChild(td);
            })(r + "_" + c, r, c);
          }
          tbl.appendChild(tr);
        }
        renderEdges();
      }
      function onDims() {
        var r = Math.min(30, Math.max(1, parseInt(rowsIn.value, 10) || 1));
        var c = Math.min(12, Math.max(1, parseInt(colsIn.value, 10) || 1));
        rowsIn.value = String(r);
        colsIn.value = String(c);
        if (r === n.rows && c === n.cols) return;
        pushHistory();
        n.rows = r;
        n.cols = c;
        buildGrid();
        markDirty();
      }
      rowsIn.addEventListener("change", onDims);
      colsIn.addEventListener("change", onDims);
      buildGrid();

      wrap.appendChild(ctr);
      wrap.appendChild(tbl);
      return wrap;
    }

    var bodyWrap = document.createElement("div");
    bodyWrap.className = "body-wrap";

    // Квадрат — свободный поток блоков: текст / «действия» / «промт»
    // в любом порядке и любом количестве (n.blocks). Примечание — просто текст.
    var isFlow = n.kind !== "note" && n.kind !== "table" && n.kind !== "image";

    function ensureBlocks() {
      var raw = Array.isArray(n.blocks) ? n.blocks : null;
      if (raw && raw.length) {
        n.blocks = raw.map(function (b) {
          var t = b && (b.t === "prompt" || b.t === "action") ? b.t : "text";
          return { t: t, v: String((b && b.v) || "") };
        });
      } else {
        // Миграция со старого формата (text / actions / prompt / *_note).
        var blocks = [{ t: "text", v: n.text || "" }];
        if (n.show_actions || n.actions) {
          blocks.push({ t: "action", v: n.actions || "" });
          blocks.push({ t: "text", v: n.actions_note || "" });
        }
        if (n.show_prompt || n.prompt) {
          blocks.push({ t: "prompt", v: n.prompt || "" });
          blocks.push({ t: "text", v: n.prompt_note || "" });
        }
        n.blocks = blocks;
      }
      if (!n.blocks.length) n.blocks = [{ t: "text", v: "" }];
    }

    function syncLegacyFields() {
      // Зеркалим блоки в старые поля — совместимость с ботом и превью.
      var texts = [], acts = [], prompts = [];
      (n.blocks || []).forEach(function (b) {
        if (b.t === "action") acts.push(b.v);
        else if (b.t === "prompt") prompts.push(b.v);
        else texts.push(b.v);
      });
      n.text = texts.join("\n").slice(0, 5000);
      n.actions = acts.join("\n\n").slice(0, 5000);
      n.prompt = prompts.join("\n\n").slice(0, 5000);
      n.actions_note = "";
      n.prompt_note = "";
      n.show_actions = acts.length > 0;
      n.show_prompt = prompts.length > 0;
    }

    // Куда вставлять новый блок: последнее место курсора в текстовом блоке.
    var lastCursor = null; // {index, pos}

    function blockChanged() {
      syncLegacyFields();
      syncChips();
      updatePreview();
      markDirty();
    }

    function removeBlockAt(i) {
      pushHistory();
      n.blocks.splice(i, 1);
      // Склеиваем соседние текстовые блоки, чтобы не плодить пустые куски.
      for (var j = n.blocks.length - 1; j > 0; j--) {
        if (n.blocks[j].t === "text" && n.blocks[j - 1].t === "text") {
          var a = n.blocks[j - 1].v, b2 = n.blocks[j].v;
          n.blocks[j - 1].v = a && b2 ? a + "\n" + b2 : (a || b2);
          n.blocks.splice(j, 1);
        }
      }
      if (!n.blocks.length) n.blocks = [{ t: "text", v: "" }];
      lastCursor = null;
      renderContent();
      blockChanged();
      renderEdges();
    }

    function insertBlock(type) {
      pushHistory();
      var idx = -1, pos = 0;
      if (lastCursor && n.blocks[lastCursor.index] && n.blocks[lastCursor.index].t === "text") {
        // Вставляем ровно там, где стоит курсор в тексте.
        idx = lastCursor.index;
        pos = Math.min(lastCursor.pos, n.blocks[idx].v.length);
      } else {
        // Курсора нет — вставляем в конец последнего текстового блока.
        for (var i = n.blocks.length - 1; i >= 0; i--) {
          if (n.blocks[i].t === "text") { idx = i; break; }
        }
        if (idx === -1) { n.blocks.push({ t: "text", v: "" }); idx = n.blocks.length - 1; }
        pos = n.blocks[idx].v.length;
      }
      var tb = n.blocks[idx];
      var before = tb.v.slice(0, pos), after = tb.v.slice(pos);
      n.blocks.splice(idx, 1,
        { t: "text", v: before },
        { t: type, v: "" },
        { t: "text", v: after });
      lastCursor = null;
      renderContent();
      blockChanged();
      // Фокус — сразу в новый блок.
      var focusTa = bodyWrap.querySelector('textarea[data-bi="' + (idx + 1) + '"]');
      if (focusTa) focusTa.focus();
      renderEdges();
    }

    function buildTextBlock(b, i) {
      var ta = document.createElement("textarea");
      ta.className = "body";
      ta.dataset.bi = String(i);
      ta.placeholder = i === 0 ? "Текст действия…" : "Обычный текст…";
      ta.value = b.v;
      function remember() {
        lastCursor = { index: i, pos: ta.selectionStart || 0 };
      }
      ta.addEventListener("focus", remember);
      ta.addEventListener("keyup", remember);
      ta.addEventListener("click", remember);
      ta.addEventListener("input", function () {
        b.v = ta.value;
        remember();
        autoGrow(ta);
        blockChanged();
      });
      return ta;
    }

    function buildActionBlock(b, i) {
      var area = document.createElement("div");
      area.className = "actions-area";
      var headRow = document.createElement("div");
      headRow.className = "aa-head";
      var label = document.createElement("div");
      label.className = "area-label";
      label.textContent = "ДЕЙСТВИЯ";
      var rm = document.createElement("button");
      rm.className = "rm";
      rm.type = "button";
      rm.textContent = "✕";
      rm.title = "Убрать этот блок действий";
      rm.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (b.v && !confirm("Убрать блок действий вместе с его текстом?")) return;
        removeBlockAt(i);
      });
      headRow.appendChild(label);
      headRow.appendChild(rm);
      var ta = document.createElement("textarea");
      ta.dataset.bi = String(i);
      ta.placeholder = "Что делать…";
      ta.value = b.v;
      ta.addEventListener("input", function () {
        b.v = ta.value;
        autoGrow(ta);
        blockChanged();
      });
      area.appendChild(headRow);
      area.appendChild(ta);
      return area;
    }

    function buildPromptBlock(b, i) {
      var promptArea = document.createElement("div");
      promptArea.className = "prompt-area";

      var paHead = document.createElement("div");
      paHead.className = "pa-head";

      // Счётчик знаков (виден, когда в промте > 100 знаков). Клик по числу
      // раскрывает промт полностью, повторный клик — сворачивает.
      var countBtn = document.createElement("button");
      countBtn.className = "count";
      countBtn.type = "button";
      countBtn.title = "Нажми, чтобы раскрыть/свернуть промт";
      countBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var expanded = promptArea.classList.toggle("expanded");
        if (expanded) {
          autoGrow(promptTa);
        } else {
          promptTa.style.height = "";
        }
        renderEdges();
      });

      var copyBtn = document.createElement("button");
      copyBtn.className = "copy";
      copyBtn.type = "button";
      copyBtn.textContent = "копировать";
      copyBtn.title = "Скопировать промт";
      copyBtn.addEventListener("click", function (ev) {
        ev.stopPropagation(); // не задевать режим стрелок
        var txt = promptTa.value || "";
        function done() {
          copyBtn.textContent = "скопировано ✓";
          setTimeout(function () { copyBtn.textContent = "копировать"; }, 1500);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(done).catch(function () {
            promptTa.select();
            document.execCommand("copy");
            done();
          });
        } else {
          promptTa.select();
          document.execCommand("copy");
          done();
        }
      });

      var rm = document.createElement("button");
      rm.className = "rm";
      rm.type = "button";
      rm.textContent = "✕";
      rm.title = "Убрать этот блок промта";
      rm.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (b.v && !confirm("Убрать блок промта вместе с его текстом?")) return;
        removeBlockAt(i);
      });

      paHead.appendChild(countBtn);
      paHead.appendChild(copyBtn);
      paHead.appendChild(rm);

      var promptTa = document.createElement("textarea");
      promptTa.dataset.bi = String(i);
      promptTa.placeholder = "Текст промта…";
      promptTa.value = b.v;
      promptTa.addEventListener("input", function () {
        b.v = promptTa.value;
        updateCount();
        blockChanged();
      });

      function updateCount() {
        var len = (b.v || "").length;
        if (len > PROMPT_COUNT_MIN) {
          countBtn.textContent = String(len);
          countBtn.classList.add("show");
        } else {
          countBtn.classList.remove("show");
          promptArea.classList.remove("expanded");
          promptTa.style.height = "";
        }
      }
      updateCount();

      promptArea.appendChild(paHead);
      promptArea.appendChild(promptTa);
      return promptArea;
    }

    function renderContent() {
      if (!isFlow) return;
      ensureBlocks();
      bodyWrap.innerHTML = "";
      n.blocks.forEach(function (b, i) {
        var blockEl = b.t === "action" ? buildActionBlock(b, i)
          : b.t === "prompt" ? buildPromptBlock(b, i)
          : buildTextBlock(b, i);
        bodyWrap.appendChild(blockEl);
      });
      Array.prototype.slice.call(bodyWrap.querySelectorAll("textarea"))
        .forEach(function (ta) { if (ta.value) autoGrow(ta); });
    }

    // --- Выделить всё содержимое квадрата: Ctrl+A дважды (или о��ин раз
    // в пустом поле). Delete/Backspace — удалить всё; печать — заменить всё;
    // Esc или клик — снять выделение. Действие можно отменить кнопкой «Вернуть».
    function isAllSelected() {
      return bodyWrap.classList.contains("all-selected");
    }
    function clearAllSelection() {
      bodyWrap.classList.remove("all-selected");
    }
    function selectAllBlocks() {
      bodyWrap.classList.add("all-selected");
      // Убираем текстовое выделение внутри поля, чтобы не путало.
      var ae = document.activeElement;
      if (ae && ae.tagName === "TEXTAREA") ae.selectionEnd = ae.selectionStart;
    }
    function replaceAllBlocks(initialText) {
      pushHistory();
      n.blocks = [{ t: "text", v: initialText || "" }];
      lastCursor = null;
      clearAllSelection();
      renderContent();
      blockChanged();
      renderEdges();
      var ta0 = bodyWrap.querySelector("textarea");
      if (ta0) {
        ta0.focus();
        ta0.selectionStart = ta0.selectionEnd = ta0.value.length;
      }
    }
    if (isFlow) {
      bodyWrap.addEventListener("keydown", function (ev) {
        var t = ev.target;
        var isTa = t && t.tagName === "TEXTAREA";
        // Ctrl/Cmd+A (независимо от раскладки — по физической клавише).
        if ((ev.ctrlKey || ev.metaKey) && (ev.code === "KeyA" || ev.key === "a" || ev.key === "A")) {
          if (!isTa) return;
          var fully = t.selectionStart === 0 && t.selectionEnd === t.value.length;
          if (isAllSelected() || fully || !t.value) {
            ev.preventDefault();
            selectAllBlocks();
          }
          // Иначе — обычный Ctrl+A выделит текущее поле; второй Ctrl+A выделит всё.
          return;
        }
        if (!isAllSelected()) return;
        if (ev.key === "Delete" || ev.key === "Backspace") {
          ev.preventDefault();
          replaceAllBlocks("");
        } else if (ev.key === "Escape") {
          clearAllSelection();
        } else if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
          // Печать поверх выделения — заменяет всё содержимое.
          ev.preventDefault();
          replaceAllBlocks(ev.key);
        } else {
          clearAllSelection();
        }
      }, true);
      // Вставка поверх «выделено всё» — заменяет всё содержимое.
      bodyWrap.addEventListener("paste", function (ev) {
        if (!isAllSelected()) return;
        ev.preventDefault();
        var txt = (ev.clipboardData && ev.clipboardData.getData("text")) || "";
        replaceAllBlocks(txt);
      }, true);
      bodyWrap.addEventListener("mousedown", function () { clearAllSelection(); }, true);
    }

    if (isFlow) {
      renderContent();
    } else {
      var body = document.createElement("textarea");
      body.className = "body";
      body.placeholder = "Текст примечания…";
      body.value = n.text || "";
      body.addEventListener("input", function () { n.text = body.value; updatePreview(); markDirty(); });
      bodyWrap.appendChild(body);
    }

    // --- «little»: название по середине (всегда полностью) + мин. 3 строки ---
    var nameView = document.createElement("div");
    nameView.className = "name-view";
    var littleText = document.createElement("div");
    littleText.className = "little-text";

    // --- Превью для режима «средняя» (усечённый текст квадратика) ---
    var preview = document.createElement("div");
    preview.className = "preview";
    function updatePreview() {
      var parts = [];
      if (isFlow && Array.isArray(n.blocks)) {
        n.blocks.forEach(function (b) {
          if (!b.v) return;
          if (b.t === "action") parts.push("Действия: " + b.v);
          else if (b.t === "prompt") parts.push("Промт: " + b.v);
          else parts.push(b.v);
        });
      } else if (n.text) {
        parts.push(n.text);
      }
      var full = parts.join("\n");
      var limit = mediumChars > 0 ? mediumChars : 100;
      preview.textContent = full.length > limit ? full.slice(0, limit) + "…" : full;
      // little-режим: полное название по середине + текст (мин. 3 строчки).
      nameView.textContent = n.name || "Без названия";
      littleText.textContent = full;
    }
    el._updatePreview = updatePreview;

    // --- Кнопка «Закрыть» внизу раскрытого квадрата (средняя/little) ---
    var closeBtn = document.createElement("button");
    closeBtn.className = "close-btn";
    closeBtn.type = "button";
    closeBtn.textContent = "Закрыть";
    closeBtn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      el.classList.remove("expanded");
      renderEdges();
    });

    function syncChips() {
      var hasAct = false, hasPr = false;
      (n.blocks || []).forEach(function (b) {
        if (b.t === "action") hasAct = true;
        if (b.t === "prompt") hasPr = true;
      });
      btnActions.classList.toggle("on", hasAct);
      btnPrompt.classList.toggle("on", hasPr);
    }
    btnActions.addEventListener("click", function (ev) {
      ev.stopPropagation();
      insertBlock("action");
    });
    btnPrompt.addEventListener("click", function (ev) {
      ev.stopPropagation();
      insertBlock("prompt");
    });

    var del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.title = n.kind === "note" ? "Удалить примечание" : "Удалить квадрат";
    del.addEventListener("click", function (ev) {
      ev.stopPropagation();
      if (!confirm("Удали��ь «" + (n.name || "без названия") + "»?")) return;
      pushHistory();
      plan.nodes = plan.nodes.filter(function (x) { return x.id !== n.id; });
      plan.edges = plan.edges.filter(function (e) { return e.from !== n.id && e.to !== n.id; });
      el.remove();
      renderEdges();
      renderTabs();
      markDirty();
    });

    // --- пупырошки по 4 сторонам ---
    ["t", "r", "b", "l"].forEach(function (side) {
      var dot = document.createElement("div");
      dot.className = "dot dot-" + side;
      dot.title = "Пупырошек: клик — тянуть стрелочку; клик, когда стрелка уже идёт отсюда — убрать её";
      dot.addEventListener("click", function (ev) { onDotClick(n, side, dot, ev); });
      el.appendChild(dot);
    });

    // --- ручка изменения ширины (тянуть правый край) ---
    var rh = document.createElement("div");
    rh.className = "resize-h";
    rh.title = "Тяни, чтобы менять ширину квадратика";
    var rsz = null;
    rh.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      rsz = { px: ev.clientX, w: nodeWidth(n), pre: snapshotData(), moved: false };
      rh.setPointerCapture(ev.pointerId);
    });
    rh.addEventListener("pointermove", function (ev) {
      if (!rsz) return;
      var z = (typeof zoom === "number" && zoom > 0) ? zoom : 1;
      var w = Math.min(nodeMaxWidth(n), Math.max(160, rsz.w + (ev.clientX - rsz.px) / z));
      if (Math.abs(w - rsz.w) > 2) rsz.moved = true;
      n.w = Math.round(w);
      el.style.width = n.w + "px";
      renderEdges();
    });
    function endResize() {
      if (rsz && rsz.moved) {
        pushHistory(rsz.pre);
        markDirty();
      }
      rsz = null;
    }
    rh.addEventListener("pointerup", endResize);
    rh.addEventListener("pointercancel", endResize);

    // --- ручка в центре: тяни, чтобы растянуть квадрат (ширина + высота).
    // Центр квадрата остаётся на месте — растёт в обе стороны.
    var rc = document.createElement("div");
    rc.className = "resize-c";
    rc.title = "Тяни за центр, чтобы растянуть квадрат";
    var crsz = null;
    rc.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      crsz = {
        px: ev.clientX, py: ev.clientY,
        w: nodeWidth(n),
        h: nodeHeight(n) || el.offsetHeight,
        x: n.x, y: n.y,
        pre: snapshotData(), moved: false
      };
      rc.setPointerCapture(ev.pointerId);
    });
    rc.addEventListener("pointermove", function (ev) {
      if (!crsz) return;
      var z = (typeof zoom === "number" && zoom > 0) ? zoom : 1;
      var dx = (ev.clientX - crsz.px) / z;
      var dy = (ev.clientY - crsz.py) / z;
      if (Math.abs(dx) + Math.abs(dy) > 3) crsz.moved = true;
      if (!crsz.moved) return;
      var w = Math.min(nodeMaxWidth(n), Math.max(160, crsz.w + dx * 2));
      var h = Math.min(1600, Math.max(60, crsz.h + dy * 2));
      n.w = Math.round(w);
      n.h = Math.round(h);
      n.x = Math.max(0, crsz.x - (n.w - crsz.w) / 2);
      n.y = Math.max(0, crsz.y - (n.h - crsz.h) / 2);
      el.style.width = n.w + "px";
      el.style.minHeight = n.h + "px";
      el.style.left = n.x + "px";
      el.style.top = n.y + "px";
      renderEdges();
    });
    function endCenterResize() {
      if (crsz && crsz.moved) {
        pushHistory(crsz.pre);
        markDirty();
      }
      crsz = null;
    }
    rc.addEventListener("pointerup", endCenterResize);
    rc.addEventListener("pointercancel", endCenterResize);
    rc.addEventListener("click", function (ev) { ev.stopPropagation(); });

    // --- ручка снизу по центру: тяни, чтобы растянуть квадрат вниз.
    // Верх квадрата остаётся на месте — растёт только высота.
    var rb = document.createElement("div");
    rb.className = "resize-b";
    rb.title = "Тяни вниз, чтобы растянуть квадрат по высоте";
    var brsz = null;
    rb.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      brsz = {
        py: ev.clientY,
        h: nodeHeight(n) || el.offsetHeight,
        pre: snapshotData(), moved: false
      };
      rb.setPointerCapture(ev.pointerId);
    });
    rb.addEventListener("pointermove", function (ev) {
      if (!brsz) return;
      var z = (typeof zoom === "number" && zoom > 0) ? zoom : 1;
      var dy = (ev.clientY - brsz.py) / z;
      if (Math.abs(dy) > 2) brsz.moved = true;
      if (!brsz.moved) return;
      var h = Math.min(1600, Math.max(60, brsz.h + dy));
      n.h = Math.round(h);
      el.style.minHeight = n.h + "px";
      renderEdges();
    });
    function endBottomResize() {
      if (brsz && brsz.moved) {
        pushHistory(brsz.pre);
        markDirty();
      }
      brsz = null;
    }
    rb.addEventListener("pointerup", endBottomResize);
    rb.addEventListener("pointercancel", endBottomResize);
    rb.addEventListener("click", function (ev) { ev.stopPropagation(); });

    el.appendChild(grip);
    if (n.kind === "table") {
      el.appendChild(buildTableBlock());
    } else if (n.kind === "image") {
      // Квадратик-фото: только картинка (стрелки и перенос — как у обычных).
      var imEl = document.createElement("img");
      imEl.className = "node-img";
      imEl.src = n.img || "";
      imEl.alt = n.name || "фото";
      imEl.draggable = false;
      el.appendChild(imEl);
    } else {
      if (n.kind !== "note") el.appendChild(head);
      el.appendChild(nameView);
      el.appendChild(bodyWrap);
      el.appendChild(preview);
      el.appendChild(littleText);
      el.appendChild(closeBtn);
    }
    el.appendChild(del);
    el.appendChild(rh);
    el.appendChild(rc);
    el.appendChild(rb);

    // Начальное состояние ярлыков / превью.
    if (isFlow) syncChips();
    updatePreview();

    // Drag by the grip row (mouse + touch via pointer events) so typing
    // in the name/text fields never fights with dragging.
    var drag = null;
    grip.addEventListener("pointerdown", function (ev) {
      if (linkMode) return; // in link mode a tap selects, not drags
      ev.preventDefault();
      // Если квадрат входит в выделение — двигаем всю выделенную группу
      // (все квадраты смещаются ровно на то же расстояние, стрелки тоже).
      var group = null;
      var groupStrokes = null;
      if (selectedIds && selectedIds.indexOf(n.id) !== -1 &&
          (selectedIds.length > 1 || (selectedStrokeIdx && selectedStrokeIdx.length))) {
        group = [];
        selectedIds.forEach(function (id) {
          var gn = findNode(id);
          if (gn) group.push({ n: gn, x: gn.x, y: gn.y });
        });
        // Выделенные линии фломастера едут вместе с группой квадратиков.
        if (selectedStrokeIdx && selectedStrokeIdx.length && Array.isArray(plan.draw)) {
          groupStrokes = [];
          selectedStrokeIdx.forEach(function (i) {
            if (plan.draw[i]) groupStrokes.push({ i: i, d: plan.draw[i].d });
          });
        }
      }
      drag = { px: ev.clientX, py: ev.clientY, x: n.x, y: n.y, moved: false, pre: snapshotData(), group: group, strokes: groupStrokes, sdx: 0, sdy: 0 };
      grip.setPointerCapture(ev.pointerId);
    });
    grip.addEventListener("pointermove", function (ev) {
      if (!drag) return;
      var dx = ev.clientX - drag.px, dy = ev.clientY - drag.py;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      if (!drag.moved) return;
      // При масштабе экранные пиксели переводим в координаты карты.
      var z = (typeof zoom === "number" && zoom > 0) ? zoom : 1;
      if (drag.group) {
        // Групповое перемещение: одинаковое смещение для всех выделенных.
        drag.group.forEach(function (g) {
          g.n.x = Math.max(0, g.x + dx / z);
          g.n.y = Math.max(0, g.y + dy / z);
          var gel = nodeEl(g.n.id);
          if (gel) {
            gel.style.left = g.n.x + "px";
            gel.style.top = g.n.y + "px";
          }
        });
        // Выделенные линии фломастера — тем же смещением (пока drag идёт —
        // через transform, координаты пути пересчитаем при отпускании).
        if (drag.strokes) {
          drag.sdx = dx / z;
          drag.sdy = dy / z;
          drag.strokes.forEach(function (s) {
            var p = world.querySelector('#draw-layer path[data-idx="' + s.i + '"]');
            if (p) p.setAttribute("transform", "translate(" + drag.sdx + " " + drag.sdy + ")");
          });
        }
      } else {
        n.x = Math.max(0, drag.x + dx / z);
        n.y = Math.max(0, drag.y + dy / z);
        el.style.left = n.x + "px";
        el.style.top = n.y + "px";
      }
      renderEdges();
    });
    // Впечатать смещение группы в координаты линий фломастера.
    function bakeDragStrokes() {
      if (!drag || !drag.moved || !drag.strokes) return;
      drag.strokes.forEach(function (s) {
        if (plan.draw && plan.draw[s.i]) {
          plan.draw[s.i].d = translatePathD(s.d, drag.sdx, drag.sdy);
        }
      });
      renderDraw();
    }
    grip.addEventListener("pointerup", function () {
      if (drag && drag.moved) { bakeDragStrokes(); pushHistory(drag.pre); markDirty(); }
      drag = null;
    });
    grip.addEventListener("pointercancel", function () {
      // Touch got interrupted (scroll, incoming call…) — don't leave a
      // stuck drag; keep whatever position the box reached.
      if (drag && drag.moved) { bakeDragStrokes(); pushHistory(drag.pre); markDirty(); }
      drag = null;
    });

    // Arrows anchor to box centers — keep them glued when the textarea
    // is resized vertically (resize: vertical) or content reflows.
    if (window.ResizeObserver) {
      new ResizeObserver(function () { renderEdges(); }).observe(el);
    }

    // Клик по квадрату: пупырошки / режим стрелок / раскрытие в «средней»/«little».
    el.addEventListener("click", function () {
      if (pendingDot) {
        if (pendingDot.nodeId !== n.id) completeDotLink(n.id);
        return;
      }
      if (linkMode) {
        if (!linkSrc) {
          linkSrc = n.id;
          el.classList.add("link-src");
          showHint("Теперь нажми на квадрат-цель — туда пойдёт стрелка");
          return;
        }
        if (linkSrc === n.id) {
          el.classList.remove("link-src");
          linkSrc = null;
          showHint("Выбор источника сброшен");
          return;
        }
        var dup = plan.edges.some(function (e) { return e.from === linkSrc && e.to === n.id; });
        if (!dup) {
          pushHistory();
          plan.edges.push({ from: linkSrc, to: n.id, style: arrowStyle, color: arrowColor, from_side: "" });
          renderEdges();
          markDirty();
          showHint("Стрелка добавлена. Клик по стрелке — удалить её");
        } else {
          showHint("Такая стрелка уже есть");
        }
        var src = nodeEl(linkSrc);
        if (src) src.classList.remove("link-src");
        linkSrc = null;
        return;
      }
      // «средняя»/«little»: клик раскрывает квадрат полностью,
      // внизу появляется кнопка «Закрыть».
      if (viewMode !== "full" && !el.classList.contains("expanded")) {
        el.classList.add("expanded");
        renderEdges();
      }
    });

    world.appendChild(el);

    // Таблица: после вставки в DOM подогнать высоту ячеек под текст
    // (учитывая ручные высоты строк).
    if (n.kind === "table" && el._fixTableHeights) {
      el._fixTableHeights();
    }
  }

  function renderAll() {
    Array.prototype.slice.call(world.querySelectorAll(".node"))
      .forEach(function (el) { el.remove(); });
    plan.nodes.forEach(renderNode);
    applyViewMode();
    renderEdges();
    renderDraw(); // линии фломастера этого плана
  }

  // --- выделение ��бводкой + Ctrl+C / Ctrl+V ---------------------------------
  var selectedIds = [];
  // Обводкой выделяются не только квадратики, но и линии фломастера
  // (индексы в plan.draw) и стрелочки (индексы в plan.edges).
  var selectedStrokeIdx = [];
  var selectedEdgeIdx = [];
  var clipboard = null; // {nodes, edges, draw}
  function clearSelection() {
    selectedIds = [];
    selectedStrokeIdx = [];
    selectedEdgeIdx = [];
    Array.prototype.slice.call(world.querySelectorAll(".node.selected"))
      .forEach(function (el) { el.classList.remove("selected"); });
    Array.prototype.slice.call(world.querySelectorAll("#draw-layer path.selected, #edges .edge.selected"))
      .forEach(function (el) { el.classList.remove("selected"); });
  }
  function setSelection(ids, strokeIdx, edgeIdx) {
    clearSelection();
    selectedIds = ids || [];
    selectedStrokeIdx = strokeIdx || [];
    selectedEdgeIdx = edgeIdx || [];
    selectedIds.forEach(function (id) {
      var el = nodeEl(id);
      if (el) el.classList.add("selected");
    });
    selectedStrokeIdx.forEach(function (i) {
      var p = world.querySelector('#draw-layer path[data-idx="' + i + '"]');
      if (p) p.classList.add("selected");
    });
    selectedEdgeIdx.forEach(function (i) {
      var p = world.querySelector('#edges path.edge[data-idx="' + i + '"]');
      if (p) p.classList.add("selected");
    });
  }
  // Сдвиг абсолютных координат в SVG-пути фломастера (M/L команды).
  function translatePathD(d, dx, dy) {
    return String(d).replace(/([ML])\s*(-?[\d.]+)[ ,](-?[\d.]+)/g, function (m0, cmd, x, y) {
      var nx = Math.round((parseFloat(x) + dx) * 10) / 10;
      var ny = Math.round((parseFloat(y) + dy) * 10) / 10;
      return cmd + nx + " " + ny;
    });
  }

  var marq = null;
  var pan = null; // «хватаем» пустое место — двигаем рабочее пространство
  var viewportEl = document.getElementById("viewport");
  world.addEventListener("pointerdown", function (ev) {
    // Работает только на пустом месте карты.
    if (ev.target !== world && ev.target !== svg) return;
    if (ev.button !== 0) return;
    if (ev.ctrlKey || ev.metaKey || ev.shiftKey) {
      // Ctrl (или Shift) + обводка мышкой — выделение нескольких квадратиков,
      // чтобы их перенести или удалить.
      var rect = world.getBoundingClientRect();
      var z = (typeof zoom === "number" && zoom > 0) ? zoom : 1;
      marq = {
        x0: (ev.clientX - rect.left) / z,
        y0: (ev.clientY - rect.top) / z,
        moved: false
      };
    } else {
      // ��росто зажали левую кнопку — хватаемся и двигаем карту.
      pan = {
        px: ev.clientX, py: ev.clientY,
        sl: viewportEl.scrollLeft, st: viewportEl.scrollTop,
        moved: false
      };
      world.style.cursor = "grabbing";
    }
    world.setPointerCapture(ev.pointerId);
  });
  world.addEventListener("pointermove", function (ev) {
    if (pan) {
      var pdx = ev.clientX - pan.px, pdy = ev.clientY - pan.py;
      if (Math.abs(pdx) + Math.abs(pdy) > 3) pan.moved = true;
      if (!pan.moved) return;
      // Тянем карту за собой: курсор вниз — смотрим, что выше, и наоборот.
      viewportEl.scrollLeft = pan.sl - pdx;
      viewportEl.scrollTop = pan.st - pdy;
      return;
    }
    if (!marq) return;
    var rect = world.getBoundingClientRect();
    var z = (typeof zoom === "number" && zoom > 0) ? zoom : 1;
    var x1 = (ev.clientX - rect.left) / z;
    var y1 = (ev.clientY - rect.top) / z;
    var x = Math.min(marq.x0, x1), y = Math.min(marq.y0, y1);
    var w = Math.abs(x1 - marq.x0), h = Math.abs(y1 - marq.y0);
    if (w + h > 6) marq.moved = true;
    if (!marq.moved) return;
    marq.rect = { x: x, y: y, w: w, h: h };
    marqueeEl.style.display = "block";
    marqueeEl.style.left = x + "px";
    marqueeEl.style.top = y + "px";
    marqueeEl.style.width = w + "px";
    marqueeEl.style.height = h + "px";
  });
  function endMarquee() {
    if (pan) {
      var wasPanMoved = pan.moved;
      world.style.cursor = "";
      pan = null;
      if (!wasPanMoved) {
        // Обычный клик по пустому месту — сброс выделения (как раньше).
        clearSelection();
        cancelPendingDot();
      }
      return;
    }
    if (!marq) return;
    marqueeEl.style.display = "none";
    if (marq.moved && marq.rect) {
      var r = marq.rect;
      var ids = [];
      plan.nodes.forEach(function (n) {
        var el = nodeEl(n.id);
        if (!el) return;
        var nx = el.offsetLeft, ny = el.offsetTop,
            nw = el.offsetWidth, nh = el.offsetHeight;
        var hit = nx < r.x + r.w && nx + nw > r.x && ny < r.y + r.h && ny + nh > r.y;
        if (hit) ids.push(n.id);
      });
      // Линии фломастера и стрелочки тоже попадают в выделение —
      // по пересечению их SVG-габаритов с рамкой.
      function bboxHit(p) {
        var bb;
        try { bb = p.getBBox(); } catch (e) { return false; }
        return bb.x < r.x + r.w && bb.x + bb.width > r.x &&
               bb.y < r.y + r.h && bb.y + bb.height > r.y;
      }
      var strokeSel = [];
      Array.prototype.slice.call(world.querySelectorAll("#draw-layer path[data-idx]"))
        .forEach(function (p) { if (bboxHit(p)) strokeSel.push(parseInt(p.dataset.idx, 10)); });
      var edgeSel = [];
      Array.prototype.slice.call(world.querySelectorAll("#edges path.edge[data-idx]"))
        .forEach(function (p) { if (bboxHit(p)) edgeSel.push(parseInt(p.dataset.idx, 10)); });
      setSelection(ids, strokeSel, edgeSel);
      if (ids.length || strokeSel.length || edgeSel.length) {
        var parts = [];
        if (ids.length) parts.push("квадратиков: " + ids.length);
        if (edgeSel.length) parts.push("стрелочек: " + edgeSel.length);
        if (strokeSel.length) parts.push("линий фломастера: " + strokeSel.length);
        showHint("Выделено " + parts.join(", ") + ". Тяни квадрат за ⋮⋮⋮ — переместится вся группа. Ctrl+C — копировать, Delete — удалить");
      }
    } else {
      clearSelection();
      cancelPendingDot();
    }
    marq = null;
  }
  world.addEventListener("pointerup", endMarquee);
  world.addEventListener("pointercancel", function () {
    marqueeEl.style.display = "none";
    marq = null;
    world.style.cursor = "";
    pan = null;
  });

  function copySelection() {
    if (!selectedIds.length && !selectedStrokeIdx.length) return false;
    var idSet = {};
    selectedIds.forEach(function (id) { idSet[id] = true; });
    var strokeSet = {};
    selectedStrokeIdx.forEach(function (i) { strokeSet[i] = true; });
    clipboard = JSON.parse(JSON.stringify({
      nodes: plan.nodes.filter(function (n) { return idSet[n.id]; }),
      edges: plan.edges.filter(function (e) { return idSet[e.from] && idSet[e.to]; }),
      draw: (plan.draw || []).filter(function (s, i) { return strokeSet[i]; })
    }));
    // Также кладём JSON выделенной области в системный буфер обмена,
    // чтобы его можно было вставить в ИИ: квадраты (название + текст),
    // стрелочки (откуда → куда, стиль) — всё в одном JSON.
    var exportData = {
      type: "plan_map_selection",
      nodes: clipboard.nodes,
      edges: clipboard.edges
    };
    var jsonText = JSON.stringify(exportData, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(jsonText).catch(function () {
        try {
          var ta = document.createElement("textarea");
          ta.value = jsonText;
          ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        } catch (e) { /* нет доступа к буферу — внутренний clipboard всё равно работает */ }
      });
    } else {
      try {
        var ta2 = document.createElement("textarea");
        ta2.value = jsonText;
        ta2.style.position = "fixed"; ta2.style.opacity = "0";
        document.body.appendChild(ta2);
        ta2.select();
        document.execCommand("copy");
        ta2.remove();
      } catch (e) { /* ignore */ }
    }
    showHint("Скопировано: " + clipboard.nodes.length + " квадратиков, " + clipboard.edges.length + " стрелочек (JSON в буфере обмена). Ctrl+V — вставить");
    return true;
  }
  function pasteClipboard() {
    if (!clipboard || !clipboard.nodes.length) return false;
    pushHistory();
    var map = {};
    var newIds = [];
    clipboard.nodes.forEach(function (src) {
      var copy = JSON.parse(JSON.stringify(src));
      map[src.id] = copy.id = uid();
      copy.x = (copy.x || 0) + 40;
      copy.y = (copy.y || 0) + 40;
      plan.nodes.push(copy);
      renderNode(copy);
      newIds.push(copy.id);
    });
    clipboard.edges.forEach(function (e) {
      plan.edges.push({ from: map[e.from], to: map[e.to], style: e.style || 1, color: e.color, from_side: e.from_side || "" });
    });
    applyViewMode();
    renderEdges();
    renderTabs();
    setSelection(newIds);
    markDirty();
    showHint("Вставлено: " + newIds.length + " квадратиков");
    return true;
  }

  function deleteSelection() {
    if (!selectedIds.length && !selectedStrokeIdx.length && !selectedEdgeIdx.length) return false;
    pushHistory();
    var idSet = {};
    selectedIds.forEach(function (id) { idSet[id] = true; });
    var edgeSet = {};
    selectedEdgeIdx.forEach(function (i) { edgeSet[i] = true; });
    var strokeSet = {};
    selectedStrokeIdx.forEach(function (i) { strokeSet[i] = true; });
    plan.nodes = plan.nodes.filter(function (n) {
      if (!idSet[n.id]) return true;
      var el = nodeEl(n.id);
      if (el) el.remove();
      return false;
    });
    plan.edges = plan.edges.filter(function (e, i) {
      return !edgeSet[i] && !idSet[e.from] && !idSet[e.to];
    });
    if (Array.isArray(plan.draw) && selectedStrokeIdx.length) {
      plan.draw = plan.draw.filter(function (s, i) { return !strokeSet[i]; });
    }
    var parts = [];
    if (selectedIds.length) parts.push("квадратиков: " + selectedIds.length);
    if (selectedEdgeIdx.length) parts.push("стрелочек: " + selectedEdgeIdx.length);
    if (selectedStrokeIdx.length) parts.push("линий фломастера: " + selectedStrokeIdx.length);
    clearSelection();
    renderEdges();
    renderDraw();
    renderTabs();
    markDirty();
    showHint("Удалено " + parts.join(", "));
    return true;
  }

  document.addEventListener("keydown", function (ev) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    var typing = tag === "INPUT" || tag === "TEXTAREA";
    if (ev.key === "Escape") {
      clearSelection();
      cancelPendingDot();
      return;
    }
    if (ev.key === "Delete" && !typing) {
      if (deleteSelection()) ev.preventDefault();
      return;
    }
    if (!(ev.ctrlKey || ev.metaKey)) return;
    // ev.code не зависит от раскладки: работает и Ctrl+C, и Ctrl+С (русская)
    var k = ev.key.toLowerCase();
    var code = ev.code || "";
    if ((k === "c" || k === "с" || code === "KeyC") && !typing) {
      if (copySelection()) ev.preventDefault();
    } else if ((k === "v" || k === "м" || code === "KeyV") && !typing) {
      if (pasteClipboard()) ev.preventDefault();
    } else if ((k === "z" || k === "я" || code === "KeyZ") && !typing) {
      undo();
      ev.preventDefault();

  });

  // --- панель шрифта (справа от планов): жирный/обычный + размер + название -
  var fontBoldBtn = document.getElementById("font-bold");

  // Название шрифта: «системный» (как было) + 5 популярных из Word.
  var DEFAULT_FONT_STACK = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  var FONT_FAMILIES = [
    { id: "system", label: "Системный", css: DEFAULT_FONT_STACK },
    { id: "calibri", label: "Calibri", css: 'Calibri, "Segoe UI", sans-serif' },

  function fontById(id) {
    for (var i = 0; i < FONT_FAMILIES.length; i++) {
      if (FONT_FAMILIES[i].id === id) return FONT_FAMILIES[i];

  FONT_FAMILIES.forEach(function (f) {

  var nodeFontBold = false;
  var nodeFontSize = 12;
  var nodeFontFamily = "system";
  // «только выбранным»: вкл — шрифт меняется лишь у выделенных квадратиков,
  // выкл — как обычно, у всех сразу.
  var fontScopeOnly = false;
  try {
    nodeFontBold = localStorage.getItem("planmap-font-bold") === "1";
    nodeFontSize = parseInt(localStorage.getItem("planmap-font-size") || "12", 10) || 12;

    fontScopeOnly = localStorage.getItem("planmap-font-scope") === "1";
  } catch (e) { /* приватный режим */ }
  if (!fontById(nodeFontFamily) || fontById(nodeFontFamily).id !== nodeFontFamily) nodeFontFamily = "system";

  // Личный шрифт квадратика (n.font = {family?, size?, bold?}) — хранится в
  // данных плана и побеждает глобальные настройки через inline CSS-переменные.
  function applyNodeFontVars(el, n) {
    var f = n && n.font;
    if (f && f.family) el.style.setProperty("--node-font-family", fontById(f.family).css);
    else el.style.removeProperty("--node-font-family");
    if (f && f.size) el.style.setProperty("--node-font-size", Math.min(32, Math.max(9, f.size)) + "px");
    else el.style.removeProperty("--node-font-size");
    if (f && typeof f.bold === "boolean") el.style.setProperty("--node-font-weight", f.bold ? "700" : "400");
    else el.style.removeProperty("--node-font-weight");
  }

  function applyFontSettings() {
    var size = Math.min(32, Math.max(9, nodeFontSize));
    document.documentElement.style.setProperty("--node-font-size", size + "px");
    document.documentElement.style.setProperty("--node-font-weight", nodeFontBold ? "700" : "400");
    document.documentElement.style.setProperty("--node-font-family", fontById(nodeFontFamily).css);
    fontBoldBtn.classList.toggle("active", nodeFontBold);
    fontNormalBtn.classList.toggle("active", !nodeFontBold);
    if (document.activeElement !== fontSizeInput) fontSizeInput.value = String(size);
    if (document.activeElement !== fontFamilySelect) fontFamilySelect.value = nodeFontFamily;
    fontScopeBtn.classList.toggle("active", fontScopeOnly);
    fontScopeBtn.setAttribute("aria-pressed", fontScopeOnly ? "true" : "false");
    // Текст стал другого размера — пересчитать высоту textarea и стрелки.
    Array.prototype.slice.call(world.querySelectorAll(".node textarea"))
      .forEach(function (ta) { if (ta.value) autoGrow(ta); });

  function saveFontSettings() {
    try {
      localStorage.setItem("planmap-font-bold", nodeFontBold ? "1" : "0");
      localStorage.setItem("planmap-font-size", String(nodeFontSize));
      localStorage.setItem("planmap-font-family", nodeFontFamily);
      localStorage.setItem("planmap-font-scope", fontScopeOnly ? "1" : "0");
    } catch (e) { /* приватный режим */ }
  }

  // Применить настройку только к выделенным квадратикам (режим «только выбранным»).
  function setFontOnSelected(patch) {
    if (!selectedIds.length) {
      showHint("Сначала выдели квадратики: Ctrl + обводка мышкой");
      return false;
    }
    pushHistory();
    selectedIds.forEach(function (id) {
      var n = findNode(id);
      if (!n) return;
      n.font = n.font || {};
      Object.keys(patch).forEach(function (k) { n.font[k] = patch[k]; });
      var el = nodeEl(id);
      if (el) {
        applyNodeFontVars(el, n);
        Array.prototype.slice.call(el.querySelectorAll("textarea"))
          .forEach(function (ta) { if (ta.value) autoGrow(ta); });
      }
    });
    renderEdges();
    markDirty();
    return true;
  }
  // Глобальная смена (режим выкл) — снимает личные переопределения этого
  // свойства у всех квадратиков, чтобы шрифт менялся действительно «везде».
  function clearFontKeyEverywhere(key) {
    var touched = false;
    plan.nodes.forEach(function (n) {
      if (n.font && key in n.font) {
        delete n.font[key];
        if (!Object.keys(n.font).length) delete n.font;
        touched = true;
        var el = nodeEl(n.id);
        if (el) applyNodeFontVars(el, n);
      }
    });
    if (touched) markDirty();
  }

  function changeFont(key, value) {
    if (fontScopeOnly) {
      var patch = {};
      patch[key] = value;
      if (setFontOnSelected(patch)) showHint("Шрифт изменён только у выделенных (" + selectedIds.length + ")");
      return;
    }
    if (key === "bold") nodeFontBold = value;
    if (key === "size") nodeFontSize = value;
    if (key === "family") nodeFontFamily = value;
    clearFontKeyEverywhere(key);
    saveFontSettings();
    applyFontSettings();
  }

  // --- фото: кнопка в меню, перетаскивание на карту, авто-сжатие ------------
  // «Авто снижение качества» (вкл по умолчанию): фото уменьшается по большей
  // сторон�� и сохраняется в экономичном формате JPEG. Выкл — как есть.
  var IMG_MAX_SIDE = 1000;
  var IMG_JPEG_QUALITY = 0.75;
  var imgAutoCompress = true;
  try { imgAutoCompress = localStorage.getItem("planmap-img-compress") !== "0"; } catch (e) {}
  var imgQualityBtn = document.getElementById("img-quality");
  function renderImgQualityBtn() {

      ? "Авто-снижение качества фото: вкл — уменьшенный размер, экономичный формат"

  });

  // Читает файл; при включённом сжатии уменьшает и конвертирует в JPEG.
  function processImageFile(file, cb) {
    if (!file || !/^image\//.test(file.type || "")) return;
    var reader = new FileReader();
    reader.onload = function () {
      var srcUrl = String(reader.result || "");
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) return;
        var outUrl = srcUrl;
        if (imgAutoCompress) {
          var scale = Math.min(1, IMG_MAX_SIDE / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          // JPEG не умеет прозрачность — подкладываем белый фон.
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          try { outUrl = canvas.toDataURL("image/jpeg", IMG_JPEG_QUALITY); } catch (e) {}
          w = cw; h = ch;
        }
        cb(outUrl, w, h);
      };
      img.src = srcUrl;
    };
    reader.readAsDataURL(file);
  }

  function addImageNode(dataUrl, natW, natH, x, y) {
    pushHistory();
    // Стартовая ширина квадратика-фото; дальше тянется за правый край.
    var wBox = Math.min(360, Math.max(160, natW));
    var n = {
      id: uid(),
      kind: "image",
      img: dataUrl,
      name: "",
      text: "",
      w: wBox,
      x: Math.max(0, x),
      y: Math.max(0, y)
    };
    plan.nodes.push(n);
    renderNode(n);
    renderTabs();
    markDirty();
    showHint(imgAutoCompress
      ? "Фото добавлено (сжато для экономии). Правый край — ширина, стрелки работают как обычно"
      : "Фото добавлено в исходном качестве. Правый край — ширина");
  }

  viewportEl.addEventListener("dragover", function (ev) {
    var types = (ev.dataTransfer && ev.dataTransfer.types) || [];
