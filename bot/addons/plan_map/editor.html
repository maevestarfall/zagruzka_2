<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>План карта</title>
<style>
  /* Apple white — тема по умолчанию */
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --box: #ffffff;
    --border: #d2d2d7;
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #0071e3;
    --danger: #ff3b30;
    --note-bg: #d9f7be;
    --note-border: #8ed35f;
    --note-text: #1e4708;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  }
  html[data-theme="dark"] {
    --bg: #0f1115;
    --panel: #171a21;
    --box: #1d2330;
    --border: #2c3444;
    --text: #e6e9ef;
    --muted: #8b93a5;
    --accent: #4f8cff;
    --danger: #e05252;
    --note-bg: #223c11;
    --note-border: #4a7d26;
    --note-text: #c4eea3;
    --shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  :root {
    /* Шрифт текста в квадратиках — управляется панелью «шрифт» в тулбаре */
    --node-font-size: 12px;
    --node-font-weight: 400;
    --node-font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  /* --- Планы (в тулбаре, между Экспорт/Импорт и переключателем вида) ----- */
  /* Высотой как кнопки «Квадрат»/«Таблица»: контейнер растянут на всю
     высоту тулбара, а каждая вкладка заполняет его по вертикали. */
  #plan-tabs {
    display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap;
    align-self: stretch;
  }
  .plan-tab {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 3px 10px 4px; font-weight: 600;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    white-space: nowrap;
    display: inline-flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0;
  }
  /* Цифра — большая, над словом «план» */
  .plan-tab .pt-num { font-size: 17px; font-weight: 800; line-height: 1.1; }
  .plan-tab .pt-word { font-size: 9.5px; font-weight: 600; line-height: 1.2; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  /* не создан / удалён — серенький фон */
  .plan-tab.empty { background: #e3e3e8; border-color: #d2d2d7; color: #86868b; }
  html[data-theme="dark"] .plan-tab.empty { background: #232936; border-color: #2c3444; color: #8b93a5; }
  /* создан — белый фон */
  .plan-tab.created { background: #ffffff; border-color: var(--border); color: #1d1d1f; }
  /* активный (выбран) — синий */
  .plan-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* --- Область шрифта (справа от планов) ----------------------------------
     Две строки: сверху «жирный»/«обычный» + название шрифта,
     под ними размер + «только выбранным» — так панель не выше
     области со стрелочками. */
  #font-panel {
    display: flex; flex-direction: column; gap: 3px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px 6px;
    align-self: stretch; justify-content: center;
  }
  #font-panel .fp-row { display: flex; align-items: center; gap: 3px; flex: 1 1 0; }
  #font-panel button {
    flex: 1 1 0;
    border: 1px solid transparent; background: transparent;
    padding: 3px 8px; font-size: 12px; border-radius: 7px; cursor: pointer;
    color: var(--text); text-align: center;
  }
  #font-panel button.active { background: var(--accent); color: #fff; }
  #font-panel #font-bold { font-weight: 800; }
  #font-panel .fp-lbl { font-size: 10px; color: var(--muted); }
  #font-panel input {
    width: 52px; padding: 3px 6px; font-size: 12px;
    background: var(--box); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; outline: none;
  }
  #font-panel input:focus { border-color: var(--accent); }
  /* Тёмная тема — справа от цифры в переключателе вида */
  #btn-theme, #btn-center-resize {
    background: var(--box) !important; color: var(--text);
    border: 1px solid var(--border) !important; border-radius: 7px !important;
    width: 26px; height: 26px; padding: 0 !important;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 13px; line-height: 1;
    flex: 0 0 auto;
  }
  #btn-theme:hover, #btn-center-resize:hover { border-color: var(--accent); }
  /* Прицел: вкл — синий (accent), выкл — приглушённый */
  #btn-center-resize svg { display: block; }
  #btn-center-resize { color: var(--muted); }
  #btn-center-resize.active {
    color: #fff;
    background: var(--accent) !important;
    border-color: var(--accent) !important;
  }
  /* «Вернуть» — плоская синяя кнопка над статусом, в ширину статуса */
  #undo-col {
    margin-left: auto;
    display: inline-flex; flex-direction: column;
    align-items: stretch; gap: 3px;
  }
  #undo-col #status { text-align: center; }
  #btn-undo {
    background: var(--accent) !important; color: #fff !important;
    border: none !important; border-radius: 8px !important;
    /* По высоте как остальные кнопки тулбара (padding 6px 9px, 12.5px) */
    padding: 6px 9px !important; cursor: pointer;
    font-size: 12.5px !important; font-weight: 600; line-height: 1.4;
    width: 100%;
  }
  #btn-undo:hover { filter: brightness(1.1); }
  #btn-undo:disabled { opacity: .45; cursor: default; filter: none; }
  #toolbar {
    flex: 0 0 auto; z-index: 50;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  #toolbar .title {
    font-weight: 700; margin-right: 6px; white-space: nowrap;
  }
  #toolbar button {
    background: var(--box); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; cursor: pointer; font-size: 12.5px;
  }
  #toolbar button:hover { border-color: var(--accent); }
  #toolbar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* --- Область «стрелочки» в меню ---------------------------------------- */
  #arrow-panel {
    display: flex; flex-direction: column; gap: 3px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px 6px;
  }
  #arrow-panel .ap-row { display: flex; align-items: center; gap: 3px; }
  /* Квадрат/Таблица/Примечание/Сохранить — по высоте как область с пупырошками */
  #btn-add, #btn-table, #btn-note, #btn-save { align-self: stretch; }
  /* «Квадрат» — шире остальных */
  #btn-add { padding-left: 16px !important; padding-right: 16px !important; min-width: 110px; }
  /* Экспорт/Импорт — друг под другом справа */
  #io-col {
    display: flex; flex-direction: column; gap: 4px; align-self: stretch;
  }
  #io-col button { flex: 1 1 0; padding: 2px 10px; font-size: 12px; }
  #arrow-panel .ap-row button {
    border: 1px solid transparent; background: transparent;
    padding: 5px 12px; font-size: 12.5px; border-radius: 7px; cursor: pointer;
    color: var(--text);
  }
  /* «выбор» и «пупырошки» — крупнее и ровно делят строку пополам */
  #btn-link, #mode-dots {
    flex: 1 1 0; text-align: center;
  }
  #arrow-panel .ap-row button.active { background: var(--accent); color: #fff; }
  #arrow-styles button {
    width: 40px; height: 22px; padding: 0 !important;
    display: flex; align-items: center; justify-content: center;
    background: var(--box) !important;
    border: 1px solid var(--border) !important; border-radius: 6px !important;
  }
  #arrow-styles button.active {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 2px rgba(0,113,227,.35);
  }
  #arrow-styles svg { display: block; }
  /* Выбор цвета стрелок — маленький квадратик рядом со стрелками */
  #arrow-color {
    width: 24px; height: 24px; padding: 1px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--box); cursor: pointer;
  }
  #arrow-color:hover { border-color: var(--accent); }
  /* Панель фломастера — рисование поверх всей области */
  #marker-col { display: flex; flex-direction: column; gap: 3px; align-self: stretch; justify-content: center; }
  #marker-col .mk-row { display: flex; align-items: stretch; gap: 3px; }
  /* Кнопка «Фломастер» — длинная, на всю ширину панели фломастера */
  #btn-marker { flex: 1 1 auto; width: 100%; min-width: 150px; text-align: center; }
  #btn-marker.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #marker-color {
    width: 24px; height: 24px; padding: 1px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--box); cursor: pointer;
  }
  #marker-size {
    width: 44px; padding: 3px 6px; font-size: 12px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--box); color: var(--text);
  }
  #marker-erase {
    /* Тянется на всё свободное место строки — кнопки прилегают друг к другу,
       без пустого места под длинной кнопкой «Фломастер» */
    flex: 1 1 auto; text-align: center;
    padding: 3px 8px; font-size: 11px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border); background: var(--box); color: var(--text);
  }
  #marker-erase.active { background: var(--danger); border-color: var(--danger); color: #fff; }
  /* --- Жёлто-чёрная «шагающая» рамка (штрихкод) на кнопках-режимах ---------
     Появляется, когда кнопка блокирует обычную работу в рабочей области:
     «Фломастер», «ластик» и «выбор». Не трогает размер кнопки. */
  #btn-marker, #marker-erase, #btn-link { position: relative; }
  #btn-marker.active::after,
  #marker-erase.active::after,
  #btn-link.active::after {
    content: ""; position: absolute; inset: -4px; border-radius: 10px;
    padding: 3px; pointer-events: none;
    background: repeating-linear-gradient(45deg, #ffd60a 0 6px, #1d1d1f 6px 12px);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    animation: ants-march 1.4s linear infinite;
  }
  /* Сдвиг на период полосок по диагонали (12px * √2) — бесшовный цикл */
  @keyframes ants-march { to { background-position: 17px 0; } }
  /* Подсветка рабочей области той же рамкой, пока включён режим,
     блокирующий обычную работу (фломастер/ластик или «выбор») */
  #viewport-wrap::after {
    content: ""; position: absolute; inset: 0; z-index: 45; pointer-events: none;
    padding: 3px;
    background: repeating-linear-gradient(45deg, #ffd60a 0 6px, #1d1d1f 6px 12px);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    opacity: 0; transition: opacity .25s ease;
    animation: ants-march 1.8s linear infinite;
  }
  body.draw-mode #viewport-wrap::after,
  body.link-mode #viewport-wrap::after { opacity: .7; }
  /* Ластик: белый квадратик-курсор, пока ластик включён.
     Размер = размер ластика с учётом масштаба карты. */
  #erase-cursor {
    position: fixed; z-index: 60; pointer-events: none;
    background: rgba(255,255,255,.92);
    border: 1.5px solid rgba(29,29,31,.6);
    border-radius: 3px;
    box-shadow: 0 1px 6px rgba(0,0,0,.25);
    transform: translate(-50%, -50%);
    display: none;
  }
  #erase-cursor.on { display: block; animation: erase-pop .18s ease-out; }
  @keyframes erase-pop { from { scale: .3; opacity: 0; } to { scale: 1; opacity: 1; } }
  /* Фото: кнопка добавления + авто-снижение качества (вкл по умолчанию) */
  #img-col { display: flex; flex-direction: column; gap: 4px; align-self: stretch; }
  #img-col button { flex: 1 1 0; padding: 2px 10px; font-size: 12px; }
  #img-quality { font-size: 11px !important; }
  #img-quality.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* Квадратик-фото: картинка на всю ширину, тянется за правый край */
  .node.image .node-img {
    display: block; width: 100%; height: auto;
    border-radius: 0 0 11px 11px;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  /* Слой рисования фломастером — поверх квадратиков */
  #draw-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 25; pointer-events: none;
  }
  #draw-layer path { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
  /* Выделенные обводкой линии фломастера и стрелки — подсветка синим */
  #draw-layer path.selected,
  #edges .edge.selected {
    opacity: 1;
    filter: drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 5px var(--accent));
  }
  body.draw-mode #draw-layer { pointer-events: auto; cursor: crosshair; }
  body.draw-mode.draw-erase #draw-layer path { pointer-events: stroke; cursor: pointer; }
  /* Выбор названия шрифта + кнопка «только выбранным» */
  #font-panel select {
    max-width: 118px; padding: 3px 4px; font-size: 11.5px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--box); color: var(--text); cursor: pointer;
  }
  #font-panel select:focus { border-color: var(--accent); }
  #font-scope { font-size: 10.5px !important; }
  #font-scope.active { background: var(--accent); color: #fff; }
  /* Переключатель вида — в тулбаре, на уровне Экспорт/Импорт.
     Две строки: сверху «литл» + «полная», ниже «средняя» + цифра + тема. */
  #view-switch {
    display: flex; flex-direction: column; gap: 4px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 3px;
    align-self: stretch; justify-content: center;
  }
  #view-switch .vs-row {
    display: flex; align-items: center; gap: 4px;
  }
  #view-switch .vs-row > button:not(#btn-theme):not(#btn-center-resize) { flex: 1 1 0; }
  #view-switch button {
    color: var(--text); cursor: pointer;
  }
  #view-switch button {
    border: 1px solid transparent; background: transparent;
    padding: 5px 10px; font-size: 12px; border-radius: 7px;
  }
  #view-switch button.active { background: var(--accent); color: #fff; }
  #view-switch input {
    width: 56px; padding: 4px 6px; font-size: 12px;
    background: var(--box); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; outline: none;
  }
  #view-switch input:focus { border-color: var(--accent); }
  #status { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #hint {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    z-index: 50; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted);
    pointer-events: none; opacity: 0; transition: opacity .2s;
  }
  #hint.show { opacity: 1; }
  #world {
    position: relative;
    width: 6000px; height: 4000px;
    transform-origin: 0 0;
  }
  #viewport-wrap {
    flex: 1 1 auto; min-height: 0;
    position: relative;
    display: flex; flex-direction: column;
  }
  #viewport {
    flex: 1 1 auto; min-height: 0;
    position: relative;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* Панель масштаба — плюс/минус с процентами, справа вверху карты */
  #zoom-panel {
    position: absolute; top: 10px; right: 14px; z-index: 40;
    display: flex; align-items: center; gap: 2px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 3px;
    box-shadow: var(--shadow);
  }
  #zoom-panel button {
    width: 30px; height: 28px;
    background: transparent; color: var(--text);
    border: none; border-radius: 7px;
    font-size: 16px; line-height: 1; cursor: pointer;
  }
  #zoom-panel button:hover { background: var(--bg); color: var(--accent); }
  #zoom-pct {
    min-width: 52px; text-align: center;
    font-size: 12px; font-weight: 700; color: var(--text);
    cursor: pointer; user-select: none; -webkit-user-select: none;
    padding: 0 2px;
  }
  #zoom-pct:hover { color: var(--accent); }
  #edges { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #edges .edge { fill: none; cursor: pointer; stroke-linecap: round; }
  #edges .edge:hover { stroke: var(--danger); }
  #edges .edge-outline { fill: none; pointer-events: none; stroke-linecap: round; }
  #edges .edge-hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
  /* Стрелка-призрак — следует за курсором, пока тянем из пупырошка */
  #edges .edge-ghost {
    fill: none; pointer-events: none;
    stroke-dasharray: 7 6; stroke-linecap: round; opacity: .85;
  }
  /* Рамка выделения (обводка мышкой) */
  #marquee {
    position: absolute; display: none; z-index: 30;
    border: 1px dashed var(--accent);
    background: rgba(0,113,227,.08);
    pointer-events: none;
  }
  .node {
    position: absolute; width: 220px;
    background: var(--box);
    border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow);
    font-family: var(--node-font-family);
  }
  .node.link-src { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .node.selected { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
  /* «Примечание» — салатовый квадратик; стрелки к нему/от него как у обычных */
  .node.note { background: var(--note-bg); border-color: var(--note-border); }
  /* У примечания нет названия — только текст, без разделительной линии */
  .node.note .body { border-top: none; color: var(--note-text); }
  .node.note .grip { color: var(--note-text); opacity: .55; }
  /* Название квадратика — чёрным текстом */
  .node .name {
    width: 100%;
    background: transparent; color: var(--text);
    border: none; outline: none;
    font-weight: 700; font-size: 13px;
    padding: 2px 10px 2px;
    cursor: text;
  }
  .node .name::placeholder { color: var(--muted); font-weight: 400; }
  .node .head {
    display: flex; align-items: center; gap: 4px; padding-right: 8px;
  }
  .node .head .name { flex: 1 1 auto; width: auto; min-width: 0; }
  .node .chip {
    flex: 0 0 auto;
    border: none; border-radius: 6px;
    font-size: 10px; font-weight: 700;
    padding: 3px 8px; cursor: pointer; line-height: 1.2;
  }
  .node .chip.chip-actions { background: #ff9500; color: #000; }
  .node .chip.chip-actions.on { box-shadow: 0 0 0 2px rgba(255,149,0,.45); }
  .node .chip.chip-prompt {
    background: #e7f3fb; color: #0f6aa8; border: 1px solid #bfe0f5;
  }
  .node .chip.chip-prompt.on { box-shadow: 0 0 0 2px rgba(15,106,168,.35); }
  html[data-theme="dark"] .node .chip.chip-prompt {
    background: #12303f; color: #6cc0f5; border-color: #1e4f66;
  }
  .node .body-wrap { position: relative; }
  /* Режим «выделено всё» (Ctrl+A дважды): подсветка всех блоков квадрата */
  .node .body-wrap.all-selected textarea,
  .node .body-wrap.all-selected .actions-area,
  .node .body-wrap.all-selected .prompt-area {
    background: rgba(60, 130, 246, 0.22) !important;
  }
  html[data-theme="dark"] .node .body-wrap.all-selected textarea,
  html[data-theme="dark"] .node .body-wrap.all-selected .actions-area,
  html[data-theme="dark"] .node .body-wrap.all-selected .prompt-area {
    background: rgba(90, 150, 250, 0.3) !important;
  }
  .node .body {
    width: 100%; min-height: 42px; resize: vertical; display: block;
    background: transparent; color: var(--text);
    border: none; border-top: 1px dashed var(--border); outline: none;
    font-family: inherit; line-height: 1.4;
    font-size: var(--node-font-size);
    font-weight: var(--node-font-weight);
    padding: 8px 10px;
  }
  /* Примечание и одиночный текст — повыше, как раньше */
  .node.note .body, .node .body:only-child { min-height: 70px; }
  .node .body::placeholder { color: var(--muted); }
  /* Ручка изменения ширины — правый край квадратика */
  .node .resize-h {
    position: absolute; top: 0; right: -5px; width: 10px; height: 100%;
    cursor: ew-resize; z-index: 4;
    touch-action: none;
  }
  .node .resize-h::after {
    content: ""; position: absolute; top: 50%; right: 4px;
    width: 3px; height: 26px; margin-top: -13px; border-radius: 2px;
    background: var(--border); opacity: 0; transition: opacity .15s;
  }
  .node:hover .resize-h::after { opacity: 1; }
  /* Ручка в центре квадратика — тяни, чтобы растянуть (ширина + высота) */
  .node .resize-c {
    position: absolute; left: 50%; top: 50%;
    width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border-radius: 50%; z-index: 7;
    cursor: nwse-resize; touch-action: none;
  }
  .node .resize-c::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--panel);
    box-shadow: 0 0 0 1px var(--border);
    opacity: 0; transition: opacity .15s;
  }
  .node:hover .resize-c::after { opacity: .9; }
  /* Выключатель центральной ручки: html.center-resize-off прячет её полностью */
  html.center-resize-off .node .resize-c { display: none; }
  /* Ручка снизу по центру — тяни, чтобы растянуть квадрат вниз (высота) */
  .node .resize-b {
    position: absolute; left: 50%; bottom: -7px;
    width: 46px; height: 14px; margin-left: -23px;
    z-index: 7;
    cursor: ns-resize; touch-action: none;
  }
  .node .resize-b::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 28px; height: 5px; margin: -2.5px 0 0 -14px; border-radius: 3px;
    background: var(--accent); border: 1px solid var(--panel);
    box-shadow: 0 0 0 1px var(--border);
    opacity: 0; transition: opacity .15s;
  }
  .node:hover .resize-b::after { opacity: .9; }
  /* Пупырошки — 4 точки по сторонам квадратика */
  .node .dot {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--panel);
    box-shadow: 0 0 0 1px var(--border);
    display: none; cursor: crosshair; z-index: 6;
    touch-action: none;
  }
  .node .dot:hover { transform: scale(1.25); }
  .node .dot.armed { background: var(--danger); }
  .node .dot.dot-t { top: -8px; left: 50%; margin-left: -7px; }
  .node .dot.dot-b { bottom: -8px; left: 50%; margin-left: -7px; }
  .node .dot.dot-l { left: -8px; top: 50%; margin-top: -7px; }
  .node .dot.dot-r { right: -8px; top: 50%; margin-top: -7px; }
  body[data-linktool="dots"] .node .dot { display: block; }
  /* --- Таблица (кнопка «Таблица» слева вверху) --------------------------- */
  .node .table-controls {
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px 6px; font-size: 11px; color: var(--muted);
  }
  .node .table-controls input {
    width: 52px; padding: 3px 6px; font-size: 12px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; outline: none;
  }
  .node .table-controls input:focus { border-color: var(--accent); }
  .node .table-controls .tc-col {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .node .table-controls .tc-lbl { font-size: 9px; color: var(--muted); line-height: 1; }
  .node .grid-table {
    width: calc(100% - 16px); margin: 0 8px 8px;
    border-collapse: collapse; table-layout: fixed;
  }
  .node .grid-table td {
    border: 1px solid var(--border); padding: 0; vertical-align: top;
    position: relative;
  }
  /* Ячейка растёт вниз под текст автоматически; вручную — ручки на границах */
  .node .grid-table textarea {
    display: block; width: 100%; min-height: 28px;
    resize: none; overflow: hidden;
    background: transparent; color: var(--text);
    border: none; outline: none;
    font-family: inherit; line-height: 1.4;
    font-size: var(--node-font-size);
    font-weight: var(--node-font-weight);
    padding: 4px 6px;
  }
  /* Ручки ручного изменения ячейки: правая граница — ширина столбца,
     нижняя граница — высота строки */
  .node .grid-table .cell-rs-x {
    position: absolute; top: 0; right: -4px; width: 8px; height: 100%;
    cursor: col-resize; z-index: 5; touch-action: none;
  }
  .node .grid-table .cell-rs-y {
    position: absolute; left: 0; bottom: -4px; width: 100%; height: 8px;
    cursor: row-resize; z-index: 5; touch-action: none;
  }
  .node .grid-table .cell-rs-x:hover,
  .node .grid-table .cell-rs-x.dragging {
    background: rgba(0,113,227,.35); border-radius: 3px;
  }
  .node .grid-table .cell-rs-y:hover,
  .node .grid-table .cell-rs-y.dragging {
    background: rgba(0,113,227,.35); border-radius: 3px;
  }
  .node .grid-table textarea:focus { background: rgba(0,113,227,.06); }
  /* Блоки «действия» и «промт» — отдельные области В ПОТОКЕ текста:
     вставляются в место курсора, в любом порядке и любом количестве. */
  .node .actions-block, .node .prompt-block { display: none; }
  .node .actions-block.show, .node .prompt-block.show { display: block; }
  /* «Действия» — оранжевая область */
  .node .actions-area {
    margin: 6px;
    background: #ff9500; color: #000;
    border-radius: 8px; padding: 4px 8px 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
  }
  .node .actions-area .aa-head {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
  }
  .node .actions-area .area-label {
    font-size: 10px; font-weight: 700; color: #000; opacity: .75;
  }
  /* ✕ — убрать вставленный блок «действия»/«промт» */
  .node .actions-area .rm, .node .prompt-area .rm {
    background: transparent; border: none; cursor: pointer;
    font-size: 11px; line-height: 1; padding: 2px 5px; border-radius: 5px;
  }
  .node .actions-area .rm { color: rgba(0,0,0,.55); }
  .node .actions-area .rm:hover { background: rgba(0,0,0,.12); color: #000; }
  .node .prompt-area .rm { color: #0f6aa8; }
  .node .prompt-area .rm:hover { background: rgba(15,106,168,.12); }
  html[data-theme="dark"] .node .prompt-area .rm { color: #6cc0f5; }
  .node .actions-area textarea {
    width: 100%; min-height: 44px; resize: vertical; display: block;
    background: transparent; color: #000;
    border: none; outline: none;
    font-family: inherit; line-height: 1.4;
    font-size: var(--node-font-size);
    font-weight: var(--node-font-weight);
  }
  .node .actions-area textarea::placeholder { color: rgba(0,0,0,.5); }
  /* «Промт» — голубой код-блок как в Telegram Desktop (```…```) */
  .node .prompt-area {
    position: relative; margin: 6px;
    background: #eaf4fb; border: 1px solid #bfe0f5; border-radius: 8px;
  }
  .node .prompt-area .pa-head {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 4px; padding: 4px 4px 0;
  }
  .node .prompt-area textarea {
    width: 100%; min-height: 56px; max-height: 76px; resize: vertical; display: block;
    background: transparent; color: #0b3a5c;
    border: none; outline: none;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 4px 8px 8px;
  }
  .node .prompt-area.expanded textarea { max-height: none; }
  .node .prompt-area textarea::placeholder { color: #7fb2d6; }
  .node .prompt-area .copy, .node .prompt-area .count {
    background: #ffffff; color: #0f6aa8;
    border: 1px solid #bfe0f5; border-radius: 6px;
    font-size: 10px; padding: 2px 7px; cursor: pointer;
  }
  .node .prompt-area .copy:hover, .node .prompt-area .count:hover { border-color: #0f6aa8; }
  .node .prompt-area .count { display: none; font-weight: 700; }
  .node .prompt-area .count.show { display: inline-block; }
  html[data-theme="dark"] .node .prompt-area {
    background: #101c26; border-color: #1e4f66;
  }
  html[data-theme="dark"] .node .prompt-area textarea { color: #a8d7f5; }
  html[data-theme="dark"] .node .prompt-area textarea::placeholder { color: #3f6d8c; }
  html[data-theme="dark"] .node .prompt-area .copy,
  html[data-theme="dark"] .node .prompt-area .count {
    background: #0f1115; color: #6cc0f5; border-color: #1e4f66;
  }
  /* Обычный текст под промтом/действиями (2 строчки) �� без обозначения
     области: без рамки и фона, просто текст. */
  .node .subnote {
    width: 100%; margin: 0 0 6px; display: block;
    min-height: 38px; resize: vertical;
    background: transparent; color: var(--text);
    border: none; border-radius: 0;
    font-family: inherit; line-height: 1.4;
    font-size: var(--node-font-size);
    font-weight: var(--node-font-weight);
    padding: 5px 10px; outline: none;
  }
  .node .subnote::placeholder { color: var(--muted); }
  /* Режимы отображения карты -------------------------------------------- */
  .node .preview {
    display: none;
    padding: 6px 10px 8px; line-height: 1.4;
    font-size: var(--node-font-size);
    font-weight: var(--node-font-weight);
    color: var(--text); white-space: pre-wrap; word-break: break-word;
    border-top: 1px dashed var(--border); cursor: pointer;
  }
  .node.note .preview { color: var(--note-text); border-top-color: var(--note-border); }
  /* little: название по середине, всегда полностью (переносится, не режется) */
  .node .name-view {
    display: none;
    font-weight: 700; font-size: 13px; text-align: center;
    color: var(--text);
    padding: 0 8px 2px;
    white-space: pre-wrap; word-break: break-word;
    cursor: pointer;
  }
  /* little: минимум 3 строчки текста ква��ратика */
  .node .little-text {
    display: none;
    padding: 2px 10px 8px; line-height: 1.4;
    font-size: var(--node-font-size);
    font-weight: var(--node-font-weight);
    color: var(--text); word-break: break-word;
    border-top: 1px dashed var(--border);
    min-height: calc(3 * 1.4 * var(--node-font-size) + 12px);
    cursor: pointer;
  }
  .node .close-btn {
    display: none;
    width: calc(100% - 12px); margin: 0 6px 6px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 12px; padding: 5px; cursor: pointer;
  }
  .node .close-btn:hover { border-color: var(--accent); }
  /* «средняя»: показываем только название + усечённый текст.
     «Примечание» (.note) всегда раскрыто во всех режимах. */
  body[data-view="medium"] .node:not(.expanded):not(.note):not(.table) .body-wrap,
  body[data-view="medium"] .node:not(.expanded):not(.note):not(.table) .actions-block,
  body[data-view="medium"] .node:not(.expanded):not(.note):not(.table) .prompt-block { display: none; }
  body[data-view="medium"] .node:not(.expanded):not(.note):not(.table) .preview { display: block; }
  /* «little»: квадрат состоит только из названия; раскрывается кликом
     (кроме «примечания» — оно всегда раскрыто) */
  body[data-view="little"] .node:not(.expanded):not(.note):not(.table) .head,
  body[data-view="little"] .node:not(.expanded):not(.note):not(.table) .body-wrap,
  body[data-view="little"] .node:not(.expanded):not(.note):not(.table) .actions-block,
  body[data-view="little"] .node:not(.expanded):not(.note):not(.table) .prompt-block,
  body[data-view="little"] .node:not(.expanded):not(.note):not(.table) .preview,
  body[data-view="little"] .node:not(.expanded):not(.note):not(.table) .little-text { display: none; }
  body[data-view="little"] .node:not(.expanded):not(.note):not(.table) .name-view {
    display: block; padding: 8px;
  }
  /* Кнопка «закрыть» видна только у раскрытого квадрата в средней/little */
  body[data-view="medium"] .node.expanded .close-btn,
  body[data-view="little"] .node.expanded .close-btn { display: block; }
  .node .del {
    position: absolute; top: -9px; right: -9px;
    width: 20px; height: 20px; line-height: 18px;
    background: var(--danger); color: #fff;
    border: none; border-radius: 50%;
    font-size: 12px; cursor: pointer; display: none;
  }
  .node:hover .del { display: block; }
  .node .grip {
    display: flex; align-items: center; justify-content: center;
    height: 18px; color: var(--muted); font-size: 10px;
    letter-spacing: 3px; cursor: grab;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .node .grip:active { cursor: grabbing; }
</style>
