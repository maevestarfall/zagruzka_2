version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lilush-bot
    restart: always
    ports:
      - "8080:8080"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/vibe_db?schema=public
      - VALKEY_URL=redis://valkey:6379/0
      - PORT=8080
    volumes:
      - bot-data:/data
    depends_on:
      - postgres
      - valkey

  postgres:
    image: postgres:18-alpine
    container_name: lilush-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vibe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    container_name: lilush-valkey
    restart: always
    ports:
      - "6379:6379"

volumes:
  bot-data:
  postgres-data:
